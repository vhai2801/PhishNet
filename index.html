<script>
{
/* ================= helpers ================= */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); };
const uid = () => Math.random().toString(36).slice(2, 9);
const today = () => new Date().toISOString().slice(0, 10);
const fmtD = d => new Date(d + (String(d).length === 10 ? "T12:00:00" : "")).toLocaleDateString(LOCALE[S.lang] || "en-US", { month:"short", day:"numeric", year:"numeric" });
const initials = n => String(n || "?").split(/\s+/).map(x => x[0]).slice(0, 2).join("").toUpperCase();
const avatar = n => `<span class="av" aria-hidden="true">${esc(initials(n))}</span>`;
const val = id => { const e = document.getElementById(id); return e ? e.value.trim() : ""; };
const store = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pctBar = (p, cls = "") => `<div class="meter ${cls}"><i style="width:${Math.max(0, Math.min(100, p))}%"></i></div>`;

/* ================= static content ================= */
const MODULES = [
 { id:"m1", ab:"EM", t:"Email phishing", diff:"Beginner", rep:1842, mins:12, s:"Mass emails pretending to be a company you trust.",
   how:"Attackers copy a real brand's logo and tone, then send the same message to thousands of inboxes, hoping a few people click before thinking.",
   signs:["Sender domain doesn't match the company","Urgent deadline or threat","Generic greeting like \"Dear Customer\"","Button or link that goes to a different address","Unexpected attachment"],
   ex:{ from:"PayPal Service <service@paypa1-billing.com>", subj:"Your account has been limited", body:"[[Dear Customer|Generic greeting]], we noticed unusual activity. [[Restore access within 24 hours|Deadline pressure]] or your account will be closed. [[Resolve now|Link goes to paypa1-billing.com, not paypal.com]]" },
   lessons:[
    ["What email phishing is","A phishing email imitates a company you already use: a bank, a delivery service, your school. The goal is to get you to sign in on a fake page, pay something, or open a file.","Most phishing is a numbers game. The message doesn't need to fool everyone, only a few people who are busy or worried."],
    ["Read the real sender","The display name (\"PayPal Service\") is free text anyone can type. What matters is the address after it, and in particular the domain: the part right before .com or .org.","On a phone, tap the sender name to reveal the full address."],
    ["Links and attachments","Hover over a link (or long-press on mobile) to see where it really goes. Attachments ending in .exe, .js, .html or a double extension like .pdf.exe are programs, not documents.","When in doubt, don't click. Open the company's site or app yourself."]] },
 { id:"m2", ab:"SP", t:"Spear phishing", diff:"Advanced", rep:611, mins:15, s:"A message written for you, using real details about you.",
   how:"The attacker researches you first: your school, your manager's name, a recent purchase. Because it feels personal, it slips past the usual alarm bells.",
   signs:["Uses your name, role or recent activity","Request is unusual for that person","Asks you to skip normal process","Comes from a lookalike of a real colleague's address"],
   ex:{ from:"Prof. Daniel K. <d.kowalski.montclair@gmail.com>", subj:"Re: CSIT 416 project files", body:"Hi Alex, as discussed in class, please [[review the updated rubric|A professor would use their university address, not Gmail]] before Friday: [[rubric-416.html|An .html attachment can open a fake login page]]" },
   lessons:[
    ["Why personal feels safe","Spear phishing borrows real context from social media, school directories or data breaches. The more a message knows about you, the more trustworthy it feels, and that is exactly the trick.","Public information is not proof of identity."],
    ["Verify through a second channel","If a message asks for something unusual, confirm it using contact details you already have: a phone number, the official portal, or in person.","Never verify by replying to the same message."],
    ["Shrink your footprint","Limit what's public on social profiles: your schedule, workplace details and who you report to. Attackers use these to build convincing stories.","Review privacy settings once a semester."]] },
 { id:"m3", ab:"SM", t:"Smishing", diff:"Beginner", rep:1530, mins:10, s:"Phishing by text message.",
   how:"Texts show less detail than email, so fake links are harder to inspect. Delivery problems, unpaid tolls and bank alerts are the most common stories.",
   signs:["Unexpected delivery, toll or bank problem","Shortened or odd link","Asks you to reply with a code","Comes from an unknown number or email address"],
   ex:{ from:"+1 (628) 555-0193", subj:"Text message", body:"USPS: [[Your package is on hold|Delivery lure]] due to an incomplete address. Update [[within 12 hrs|Deadline pressure]]: [[usps-redelivery.top/track|Not usps.com, and .top is a common scam ending]]" },
   lessons:[
    ["The common stories","Package on hold, unpaid toll, suspicious bank charge, prize you didn't enter for. They all push you to tap a link right now.","Real carriers rarely text a link unless you signed up for alerts."],
    ["Never share codes","A one-time code texted to you is the key to your account. No real company will ask you to read it back to them.","If someone asks for a code, it's a scam, every time."],
    ["What to do instead","Don't tap the link. Open the official app or type the site address yourself. Forward scam texts to 7726 (SPAM) to report them to your carrier.","Then delete the message."]] },
 { id:"m4", ab:"VI", t:"Vishing", diff:"Intermediate", rep:702, mins:11, s:"Phishing by phone call or voicemail.",
   how:"Callers pose as your bank, tech support or a government agency, often with a spoofed caller ID. AI voice cloning can now imitate people you know.",
   signs:["Caller ID shows a trusted name","Pressure to act while on the call","Asks for codes, passwords or remote access","Threatens arrest, fines or account closure"],
   ex:{ from:"Voicemail transcript", subj:"Missed call: \"Chase Fraud Dept\"", body:"This is the Chase fraud department. [[We've frozen your card|Fear trigger]]. [[Call us back immediately|Urgency]] at 1-888-555-0110 and have your [[online banking password|Banks never ask for your password]] ready." },
   lessons:[
    ["Caller ID can lie","Scammers can make any name or number appear on your screen. A familiar caller ID is not proof.","Treat unexpected calls about money or accounts as unverified."],
    ["Hang up and call back","End the call and dial the number printed on your card or on the official website. A real bank will understand.","Never use a number the caller gives you."],
    ["Voice cloning","A few seconds of audio can be enough to clone a voice. Agree on a family code word for emergencies.","If a loved one calls asking for money, hang up and call them back."]] },
 { id:"m5", ab:"BE", t:"Business email compromise", diff:"Advanced", rep:488, mins:14, s:"Pretending to be a boss or vendor to move money.",
   how:"A 'CEO' asks for gift cards, or a 'vendor' sends new bank details for an invoice. These messages often contain no links at all, so filters miss them.",
   signs:["Request for gift cards or a wire transfer","New or changed payment details","Asks for secrecy","Sent from a personal or lookalike address"],
   ex:{ from:"Maria Chen (CEO) <maria.chen.office@gmail.com>", subj:"Quick favor", body:"Are you at your desk? I need you to [[pick up 5 Apple gift cards|Gift cards are untraceable payment]] for a client. [[Keep this between us|Secrecy request]] for now, I'm in meetings all day." },
   lessons:[
    ["Money without malware","BEC relies on authority and routine, not malicious links. That's why it causes some of the largest losses of any scam type.","Filters can't catch what looks like a normal message."],
    ["Payment changes need a phone call","Any change to bank details or an unusual payment should be confirmed by phone using a number you already had on file.","Build this into team process so nobody has to feel rude."],
    ["Gift cards are a giveaway","No legitimate manager pays clients with gift cards. Requests for them, especially with secrecy, are a strong scam signal.","Report it to IT or security right away."]] },
 { id:"m6", ab:"CL", t:"Clone phishing", diff:"Intermediate", rep:356, mins:9, s:"A copy of a real email you got, with the link swapped.",
   how:"The attacker takes a legitimate message, like a shared document or a receipt, and resends it as an \"updated version\" with a malicious link or attachment.",
   signs:["Duplicate of an email you already received","Says \"resending\" or \"updated version\"","Link points to a different domain than the original"],
   ex:{ from:"DocuSign <dse@docusign-mail.review>", subj:"RESENT: Lease agreement ready to sign", body:"[[We are resending this document|Clone of an earlier real message]] because the previous link expired. [[Review document|docusign-mail.review is not docusign.net]]" },
   lessons:[
    ["Why clones work","You recognise the message, so you relax. The attacker counts on that familiarity.","A second copy you didn't expect is a reason to look closer, not less."],
    ["Compare with the original","Open the first email and compare the sender address and link destination. Any difference is a red flag.","Search your inbox for the original before clicking."],
    ["Go to the source","For signatures and shared files, open the service directly and check your pending items there.","Real requests will be waiting in your account."]] },
 { id:"m7", ab:"QR", t:"Quishing", diff:"Intermediate", rep:297, mins:8, s:"Malicious QR codes.",
   how:"QR codes on parking meters, flyers or in emails can lead to fake payment or login pages. Because you can't read a QR code by eye, it hides the destination.",
   signs:["Sticker placed over an original code","QR code in an email asking you to sign in","Payment page that doesn't match the operator"],
   ex:{ from:"IT Security <noreply@m365-security-check.com>", subj:"Scan to keep your MFA active", body:"Your multi-factor setup expires today. [[Scan this QR code with your phone|Moves you to a device with less protection]] to re-enroll. [[Failure to comply will lock your account|Threat]]." },
   lessons:[

const DASH_LABEL = { progress:"Your progress", quiz:"Quiz", sim:"Testing Lab results", next:"Where to go next", badges:"Achievements", reports:"My reports" };

  if (k === "reports"){ const mine = S.reports.filter(r => r.by === "Alex Morgan"); return `<div class="panel card"><h3>My reports</h3>${mine.length ? `<ul class="list">${mine.map(r => `<li style="padding:10px 0"><b class="small">${r.ref}</b> ${statusPill(r.status)}<div class="small muted">${esc(r.type)} · ${fmtD(r.date)}</div></li>`).join("")}</ul>` : `<p class="muted">No reports yet.</p>`}<div class="row"><a class="btn sm" href="#community" data-act="tab" data-k="com" data-v="report">Report a phish</a></div></div>`; }

const FAQ = [[/spf|dkim|dmarc|header|encabezad|tiêu đề/, "SPF checks that the sending server is allowed to send for that domain. DKIM is a digital signature proving the message wasn't altered and came from the domain. DMARC tells receivers what to do when those fail. In the Testing Lab, the email spoofing tester explains each result."],
 [/clicked|entered|what (do|should) i do|hacked|hice clic|qué hago|hackead|đã bấm|bị hack|làm gì/, "Stay calm. 1) Change the password for that account from a trusted device, plus anywhere you reused it. 2) Turn on two-step verification. 3) If you shared card details, call your bank using the number on your card. 4) Report it under Community > Report a phish and at reportfraud.ftc.gov."],
 [/certificate|linkedin|certificado|chứng chỉ/, "Complete all 8 training modules and score at least 70% on the quiz. Then open your dashboard and choose Get certificate. You can download it and add it to LinkedIn with the details filled in."],
 [/smish|text|mensaje de texto|tin nhắn/, "Smishing is phishing by text. Watch for delivery problems, unpaid tolls, prizes and requests for codes. Don't tap links; open the official app instead. You can paste a suspicious text into the Testing Lab's text message verifier."],
 [/qr|quish/, "A QR code is just a hidden link. Your camera usually previews the address before opening it, so read it. For parking or payments, use the official app or type the address on the sign."],
 [/simulat|testing lab|inbox|simulador|mô phỏng|laboratorio/, "The phishing simulator gives you a practice inbox of 10 messages. Mark each as Safe or Phishing, then Finish to see your score and every warning sign. 80% passes. You'll need at least one completed module to unlock it."],
 [/quiz|retake|notes|cuestionario|câu đố|làm lại/, "The quiz has 10 questions and a 70% passing mark. If you score below that, you can retake it with an open-notes panel showing lessons for the topics you missed, up to 3 times a day."],
 [/report|reportar|báo cáo/, "Go to Community > Report a phish. Choose what you received, fill in the details and answer three quick questions. You'll get a reference number like PN-2026-123456, and an administrator will review it."],
 [/password|passphrase|contraseña|mật khẩu/, "Use a long passphrase of 4 to 6 random words, a different one for every account, stored in a password manager. Try the generator and strength tester under Security Tools."],
 [/spear|bec|ceo|gift card|tarjeta de regalo|thẻ quà tặng/, "Messages asking for gift cards, wire transfers or secrecy, especially from a 'boss' on a personal email, are business email compromise. Always verify with a phone call to a number you already have."]];
function fallback(q){ const l = q.toLowerCase(); const hit = FAQ.find(f => f[0].test(l)); return hit ? hit[1] : FAQ_MISS[S.lang] || "I can help with phishing questions and using Phish Net: the Testing Lab, quiz, certificates, reporting, or what to do if you clicked something. Could you rephrase your question?"; }
const SITE_GUIDE = `You are the AI tutor inside Phish Net, an educational phishing-awareness website for students. Be brief (under 120 words), friendly and plain. Use only these facts about the site: Learn has attack types (sortable), 8 training modules, videos and guides with notes. Testing Lab has a scanner (URL, text message, email headers) and a 10-message phishing simulator (80% to pass, unlocks after 1 module). Security Tools: password tester, passphrase generator, breach checker, URL deconstructor. Quiz: 10 questions, 70% pass, open-notes retakes up to 3 per day. Certificate: all 8 modules plus quiz pass, downloadable and addable to LinkedIn. Community: reports with upvotes, report form with reference numbers, Q&A, news alerts, leaderboard, ratings, support (support@phishnet.example). Never ask for passwords or codes. Results are guidance, not guarantees. If scammed: change passwords from a trusted device, enable two-step verification, call the bank, report at reportfraud.ftc.gov.`;

const SUGG = ["What are SPF and DKIM?","I clicked a bad link. What now?","How do I get my certificate?","Is it safe to scan QR codes?"];
function chatHtml(){ return (CHAT.length ? CHAT : [{ role:"assistant", content:"Hi! I'm the Phish Net tutor. Ask me about phishing, or how to use anything on this site." }]).map(m => `<div class="msg ${m.role === "user" ? "u" : "a"}">${esc(m.content)}</div>`).join(""); }

function paintChat(){ ["#tLog", "#chatLog"].forEach(s => { const el = $(s); if (el){ el.innerHTML = chatHtml(); el.scrollTop = el.scrollHeight; } }); }
async function sendChat(q, matchAs){ if (!q) return; CHAT.push({ role:"user", content:q }); CHAT.push({ role:"assistant", content:"…" }); paintChat(); const slot = CHAT[CHAT.length - 1];
  if (!SAMPLE_FN){ setTimeout(() => { slot.content = fallback(matchAs || q); paintChat(); }, 450); return; }
  const hist = CHAT.slice(0, -1).slice(-10); while (hist.length && hist[0].role !== "user") hist.shift();
  const turns = hist.map((m, i) => i === 0 ? { role:"user", content:SITE_GUIDE + `\nReply in ${S.lang === "en" ? "the user's language" : LANG_NAME[S.lang]}.\n\nUser: ` + m.content } : { role:m.role, content:m.content });
  try { const r = await SAMPLE_FN(turns, { cache:false, modelTier:"quick", onText:({ text }) => { slot.content = text; paintChat(); } }); slot.content = r.text; }
  catch(e){ slot.content = e && e.code === "rate_limited" ? "Lots of questions right now. Try again in a minute." : fallback(matchAs || q); }
  paintChat(); }

function admReportDetail(r){ const dom = r.url ? (() => { try { return regDomain(new URL(r.url).hostname); } catch { return ""; } })() : r.sender && r.sender.includes("@") ? regDomain(domOf(r.sender)) : "", dup = S.reports.filter(x => x.id !== r.id && dom && ((x.url || "") + (x.sender || "")).includes(dom)), onBl = dom && S.blacklist.find(b => b.v === dom);

  return `<div class="crumb"><button data-act="tab" data-k="admRepOpen" data-v="">Reports</button> / ${r.ref}</div><div class="split"><div class="panel"><div class="row" style="margin:0 0 10px"><h2 style="margin:0">${r.ref}</h2>${statusPill(r.status)}</div>
   <p class="tiny muted">Restricted view: contains the original submission with personal details.</p><table class="stack"><tbody><tr><th>Type</th><td>${esc(r.type)}</td></tr><tr><th>Reporter</th><td>${esc(r.by)}</td></tr><tr><th>Received</th><td>${fmtD(r.date)}</td></tr>${r.sender ? `<tr><th>Sender</th><td><code>${esc(r.sender)}</code></td></tr>` : ""}${r.url ? `<tr><th>URL</th><td><code style="color:var(--flag);word-break:break-all">${esc(r.url)}</code></td></tr>` : ""}<tr><th>What happened</th><td>${esc(r.what)}</td></tr><tr><th>Clicked / opened / entered</th><td>${["clicked","opened","entered"].map(k => r[k] ? "Yes" : "No").join(" / ")}</td></tr>${(r.files || []).length ? `<tr><th>Evidence</th><td>${r.files.map(f => `<span class="pill p-ok">${esc(f)} · scanned clean</span>`).join(" ")}</td></tr>` : ""}</tbody></table>
   ${dom ? `<div class="verdict ${onBl ? "v-danger" : "v-warn"}" style="margin-top:14px"><h3 style="font-size:1rem">${esc(dom)}</h3><p class="small" style="margin:0">${onBl ? "Already on the blacklist." : "Not on the blacklist yet."} ${dup.length ? `Possible duplicates: ${dup.map(d => d.ref).join(", ")}.` : ""}</p></div>` : ""}
   ${r.reason ? `<p class="small" style="margin-top:12px"><b>Decision note:</b> ${esc(r.reason)}</p>` : ""}</div>
   <aside class="panel"><h3>1. Triage</h3><p class="small muted">Check completeness, hide personal data, spot duplicates.</p><div class="row" style="flex-direction:column;align-items:stretch">${[["Ready for Verification","Ready for verification"],["Needs More Information","Needs more information"],["Duplicate","Mark duplicate"],["Hidden","Hide from public"]].map(([s, l]) => `<button class="btn ghost sm" data-act="triage" data-s="${s}" ${closed || r.status === s ? "disabled" : ""}>${l}</button>`).join("")}</div>
   <h3 style="margin-top:18px">2. Verify</h3><p class="small muted">Approving adds ${dom ? esc(dom) : "the link or domain"} to the blacklist used by the scanner.</p><div class="row"><button class="btn danger" data-act="approve" ${closed || r.status !== "Ready for Verification" ? "disabled" : ""}>Approve as phishing</button><button class="btn ghost" data-act="reject" ${closed ? "disabled" : ""}>Reject</button></div>${r.status !== "Ready for Verification" && !closed ? `<p class="tiny muted">Mark it ready for verification first.</p>` : ""}</aside></div>`; }
ACT.triage = a => { const r = S.reports.find(x => x.id === UI.admRepOpen), s = a.dataset.s;
  const go = reason => { r.status = s; if (reason) r.reason = reason; if (s === "Hidden") r.hidden = true; audit(`Triaged ${r.ref} as ${s}${reason ? ` (${reason})` : ""}`); if (s === "Needs More Information") notify(`Admin asked for more details on ${r.ref}`); save(); render(); toast(`${r.ref}: ${s}`); };
  if (s === "Needs More Information" || s === "Hidden" || s === "Duplicate") ask({ title: s === "Needs More Information" ? "What's missing?" : s === "Duplicate" ? "Link to existing report" : "Why hide it?", fields:[{ id:"r", label: s === "Duplicate" ? "Existing reference number" : "Reason", type:"text", req:true }], ok:"Save" }, o => go(o.r)); else go(""); };
ACT.approve = () => { const r = S.reports.find(x => x.id === UI.admRepOpen); let dom = ""; try { dom = r.url ? regDomain(new URL(r.url).hostname) : r.sender && r.sender.includes("@") ? regDomain(domOf(r.sender)) : ""; } catch {}
  modal(`<h2>Approve ${r.ref} as phishing?</h2><p>${dom ? `<b>${esc(dom)}</b> will be added to the active blacklist and flagged as High Risk in the scanner.` : "No link or domain was found to blacklist. The report will still be marked Verified Phishing."} The reporter will be notified.</p><div class="row"><button class="btn danger" data-act="approveYes" data-d="${esc(dom)}">Approve</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>`); };
ACT.approveYes = a => { closeModal(); const r = S.reports.find(x => x.id === UI.admRepOpen), dom = a.dataset.d; r.status = "Verified Phishing";
  if (dom && !S.blacklist.some(b => b.v === dom)) S.blacklist.unshift({ id:uid(), v:dom, kind:"Domain", status:"Active", reason:`Verified from community report: ${r.type.toLowerCase()} phishing`, src:r.ref, added:today(), rev:today() });
  r.replies.push({ by:"Admin", t:"Confirmed as phishing and added to the blacklist. Thank you." }); audit(`Approved report ${r.ref}${dom ? `; added ${dom} to blacklist` : ""}`); if (r.by === "Alex Morgan") notify(`Your report ${r.ref} was verified as phishing. Thank you.`); save(); render(); toast("Verified and added to the blacklist"); };
ACT.reject = () => ask({ title:"Reject this report", text:"Explain why it isn't phishing. The reporter will see this.", fields:[{ id:"r", label:"Reason", type:"textarea", req:true, min:10, max:500 }], ok:"Reject", danger:true }, o => { const r = S.reports.find(x => x.id === UI.admRepOpen); r.status = "Rejected"; r.reason = o.r; audit(`Rejected report ${r.ref}: ${o.r}`); if (r.by === "Alex Morgan") notify(`Your report ${r.ref} was reviewed: not phishing.`); save(); render(); toast("Report rejected and reporter notified"); });
function admBlacklist(){ return `<div class="split"><div class="panel scroll"><table class="stack"><thead><tr><th>URL or domain</th><th>Status</th><th>Source</th><th>Added</th><th>Last review</th><th></th></tr></thead><tbody>${S.blacklist.map(b => `<tr><td><code style="word-break:break-all">${esc(b.v)}</code><div class="tiny muted">${esc(b.reason)}</div></td><td><span class="pill ${b.status === "Active" ? "p-red" : ""}">${b.status}</span></td><td class="nowrap small">${esc(b.src)}</td><td class="nowrap small">${fmtD(b.added)}</td><td class="nowrap small">${fmtD(b.rev)}</td><td class="right nowrap"><button class="btn ghost sm" data-act="blEdit" data-id="${b.id}">Edit</button> <button class="btn ghost sm" data-act="blToggle" data-id="${b.id}">${b.status === "Active" ? "Deactivate" : "Reactivate"}</button> <button class="btn ghost sm" data-act="blRemove" data-id="${b.id}">Remove</button></td></tr>`).join("")}</tbody></table></div>
  <form class="panel" id="blF"><h3>Add an entry</h3><p class="small muted">New entries need a verified report as evidence.</p><label for="blV">URL or domain</label><input type="text" id="blV" placeholder="example-phish.com" spellcheck="false"><label for="blS">Verified report reference</label><select id="blS"><option value="">Choose</option>${S.reports.filter(r => r.status === "Verified Phishing").map(r => `<option>${r.ref}</option>`).join("")}</select><label for="blR">Reason</label><input type="text" id="blR"><div class="err" id="e_bl"></div><div class="row"><button class="btn" type="submit">Add to blacklist</button></div></form></div>`; }
function addBlacklist(e){ e.preventDefault(); let v = val("blV").toLowerCase().replace(/\/$/, ""), src = val("blS"), reason = val("blR"), er = $("#e_bl");
  if (!src){ er.textContent = "Entries need verified evidence. Approve the report first under Reports."; return; }
  if (!/^(https?:\/\/)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/\S*)?$/.test(v)){ er.textContent = "That doesn't look like a valid URL or domain."; return; }
  if (!reason){ er.textContent = "Add a reason."; return; }
  const ex = S.blacklist.find(b => b.v === v); if (ex){ er.innerHTML = `${esc(v)} is already listed. <button class="btn ghost sm" type="button" data-act="blEdit" data-id="${ex.id}">Update it instead</button>`; return; }
  modal(`<h2>Add ${esc(v)}?</h2><p>The scanner will flag it as High Risk immediately.</p><div class="row"><button class="btn danger" data-act="blAddYes">Add</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>`); UI._bl = { v, src, reason }; }
ACT.blAddYes = () => { closeModal(); const o = UI._bl; S.blacklist.unshift({ id:uid(), v:o.v, kind:o.v.includes("/") ? "URL" : "Domain", status:"Active", reason:o.reason, src:o.src, added:today(), rev:today() }); audit(`Added ${o.v} to blacklist (evidence ${o.src})`); save(); render(); toast("Blacklist updated"); };
ACT.blToggle = a => { const b = S.blacklist.find(x => x.id === a.dataset.id), to = b.status === "Active" ? "Deactivated" : "Active"; ask({ title:`${to === "Active" ? "Reactivate" : "Deactivate"} ${b.v}`, fields:[{ id:"j", label:"Justification", type:"textarea", req:true, min:10 }], ok:"Confirm" }, o => { b.status = to; b.rev = today(); audit(`${to === "Active" ? "Reactivated" : "Deactivated"} ${b.v}: ${o.j}`); save(); render(); toast("Blacklist updated"); }); };
ACT.blRemove = a => { const b = S.blacklist.find(x => x.id === a.dataset.id); ask({ title:`Remove ${b.v}`, text:"Use this for confirmed false positives. History stays in the audit log.", fields:[{ id:"j", label:"Justification", type:"textarea", req:true, min:10 }], ok:"Remove", danger:true }, o => { S.blacklist = S.blacklist.filter(x => x !== b); audit(`Removed ${b.v} from blacklist: ${o.j}`); save(); render(); toast("Entry removed"); }); };
ACT.blEdit = a => { const b = S.blacklist.find(x => x.id === a.dataset.id); ask({ title:`Edit ${b.v}`, fields:[{ id:"r", label:`Reason (currently: ${b.reason})`, type:"text", req:true }, { id:"j", label:"Justification for the change", type:"textarea", req:true, min:10 }], ok:"Save" }, o => { b.reason = o.r; b.rev = today(); audit(`Edited ${b.v}: ${o.j}`); save(); render(); toast("Entry updated"); }); };
function admUsers(){ if (UI.userOpen) return userDetail(S.users.find(u => u.id === UI.userOpen));
  const q = UI.userQ.toLowerCase(), list = S.users.filter(u => (!q || (u.name + u.email).toLowerCase().includes(q)) && (!UI.userRole || u.role === UI.userRole) && (!UI.userStatus || u.status === UI.userStatus)).sort((a, b) => a.name.localeCompare(b.name));
  return `<div class="filters"><input type="search" id="uQ" placeholder="Search name or email" value="${esc(UI.userQ)}" aria-label="Search users"><select id="uR" aria-label="Role"><option value="">All roles</option>${["Learner","Administrator"].map(r => `<option ${UI.userRole === r ? "selected" : ""}>${r}</option>`).join("")}</select><select id="uS" aria-label="Status"><option value="">All statuses</option>${["Active","Warned","Suspended","Banned"].map(s => `<option ${UI.userStatus === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
  <div class="panel scroll"><table class="stack"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th><th></th></tr></thead><tbody>${list.map(u => `<tr><td><b>${esc(u.name)}</b></td><td class="small">${esc(u.email)}</td><td>${u.role}</td><td><span class="pill ${u.status === "Active" ? "p-ok" : u.status === "Warned" ? "p-warn" : "p-red"}">${u.status}</span></td><td class="nowrap small">${fmtD(u.joined)}</td><td class="right"><button class="btn ghost sm" data-act="userOpen" data-id="${u.id}">Open</button></td></tr>`).join("") || `<tr><td colspan="6" class="muted">No users found.</td></tr>`}</tbody></table></div>`; }
ACT.userOpen = a => { UI.userOpen = a.dataset.id; render(); };
function userDetail(u){ const adm = u.role === "Administrator";
  const can = { Warn: u.status !== "Warned" && u.status !== "Banned", Suspend: u.status !== "Suspended" && u.status !== "Banned", Ban: u.status !== "Banned", Restore: u.status === "Suspended" || u.status === "Banned" };
  return `<div class="crumb"><button data-act="tab" data-k="userOpen" data-v="">User accounts</button> / ${esc(u.name)}</div><div class="grid2"><div class="panel"><div class="row" style="margin:0 0 12px">${avatar(u.name)}<h2 style="margin:0">${esc(u.name)}</h2><span class="pill ${u.status === "Active" ? "p-ok" : u.status === "Warned" ? "p-warn" : "p-red"}">${u.status}</span></div>
   <table class="stack"><tbody><tr><th>Email</th><td>${esc(u.email)}</td></tr><tr><th>Role</th><td>${u.role}</td></tr><tr><th>Joined</th><td>${fmtD(u.joined)}</td></tr><tr><th>Last login</th><td>${fmtD(u.last)}</td></tr><tr><th>Training</th><td>${u.prog} of 8 modules</td></tr>${u.until ? `<tr><th>Suspended until</th><td>${fmtD(u.until)}</td></tr>` : ""}</tbody></table></div>
   <div class="panel"><h3>Moderate</h3>${adm ? `<p class="muted">You cannot moderate administrator accounts.</p>` : ""}<div class="row">${Object.entries(can).map(([k, ok]) => `<button class="btn ${k === "Ban" ? "danger" : k === "Restore" ? "okb" : "ghost"}" data-act="moderate" data-a="${k}" ${adm || !ok ? "disabled" : ""} title="${!ok ? `This account is already ${u.status.toLowerCase()}` : ""}">${k}</button>`).join("")}</div><p class="small muted" style="margin-top:12px">Suspended or banned users are signed out everywhere and emailed the reason.</p></div></div>`; }
ACT.moderate = a => { const u = S.users.find(x => x.id === UI.userOpen), act = a.dataset.a;
  const fields = [{ id:"r", label:"Reason", type:"textarea", req:true, min:10, max:500 }]; if (act === "Suspend") fields.push({ id:"len", label:"Length", type:"select", options:["1 day","7 days","30 days","90 days"], req:true });
  ask({ title:`${act} ${u.name}`, fields, ok:act, danger:act === "Ban" }, o => { const st = { Warn:"Warned", Suspend:"Suspended", Ban:"Banned", Restore:"Active" }[act]; u.status = st;
    if (act === "Suspend"){ const d = new Date(); d.setDate(d.getDate() + parseInt(o.len)); u.until = d.toISOString().slice(0, 10); } else if (act === "Restore") delete u.until;
    audit(`${act === "Restore" ? "Restored" : st} ${u.name}${o.len ? ` for ${o.len}` : ""}: ${o.r}`); save(); render(); toast(`Action applied to ${u.name}. They were emailed the reason.`); }); };
function admRatings(){ const list = [...S.ratings].sort((a, b) => (b.state === "Flagged") - (a.state === "Flagged"));
  return `<div class="panel"><ul class="list">${list.map(r => `<li><div class="row" style="margin:0"><b>${esc(r.by)}</b><span style="color:var(--rope)">${"★".repeat(r.stars)}</span><span class="pill ${r.state === "Flagged" ? "p-red" : r.state === "Removed" ? "" : r.state === "Reviewed" ? "p-rope" : "p-ok"}">${r.state}${r.flags ? ` · ${r.flags} flags` : ""}</span><span class="muted small">${fmtD(r.date)}</span></div><p style="margin:6px 0">${esc(r.text) || `<span class="muted">No comment</span>`}</p>
   <div class="row" style="margin:0"><button class="btn ghost sm" data-act="rateMod" data-id="${r.id}" data-s="Published">Keep</button><button class="btn ghost sm" data-act="rateMod" data-id="${r.id}" data-s="Reviewed">Mark reviewed</button><button class="btn ghost sm" data-act="rateMod" data-id="${r.id}" data-s="Removed">Remove</button>${r.state === "Flagged" ? `<button class="btn danger sm" data-act="rateBlock" data-id="${r.id}">Block user from posting</button>` : ""}</div></li>`).join("")}</ul></div>`; }
ACT.rateMod = a => { const r = S.ratings.find(x => x.id === a.dataset.id); r.state = a.dataset.s; if (a.dataset.s === "Published" || a.dataset.s === "Reviewed") r.flags = 0; if (a.dataset.s === "Reviewed") r.state = "Published"; audit(`${a.dataset.s === "Removed" ? "Removed" : a.dataset.s === "Reviewed" ? "Marked reviewed" : "Kept"} rating by ${r.by}`); save(); render(); toast(a.dataset.s === "Removed" ? "Comment removed and average updated" : "Saved"); };
ACT.rateBlock = a => { const r = S.ratings.find(x => x.id === a.dataset.id); r.state = "Removed"; const u = S.users.find(x => x.name === r.by); if (u) u.status = "Suspended"; audit(`Blocked ${r.by} from posting comments (spam)`); save(); render(); toast(`${r.by} can no longer post comments`); };
function admAlerts(){ return `<div class="split"><div>${S.alerts.map(a => `<div class="alert ${a.level === "Urgent" ? "urg" : ""}"><div class="row" style="margin:0 0 4px"><span class="pill ${a.level === "Urgent" ? "p-red" : "p-warn"}">${a.level}</span><b>${esc(a.title)}</b><span class="muted small">${fmtD(a.date)}</span><span class="sp"></span><button class="btn ghost sm" data-act="alertDel" data-id="${a.id}">Remove</button></div><div class="small">${esc(a.body)}</div></div>`).join("")}</div>
  <form class="panel" id="alertF"><h3>Post a news alert</h3><label for="nT">Headline</label><input type="text" id="nT" maxlength="140"><label for="nB">Details</label><textarea id="nB" style="min-height:90px"></textarea><label for="nL">Severity</label><select id="nL"><option>Advisory</option><option>Urgent</option></select><div class="hint">Urgent alerts also show as a banner at the top of every page.</div><label for="nTp">Topic</label><select id="nTp">${["New phishing scams","Data breaches","Scams targeting students","Account and password security","Phish Net updates"].map(t => `<option>${t}</option>`).join("")}</select><label for="nS">Source link (optional)</label><input type="url" id="nS" placeholder="https://www.cisa.gov/..."><div class="err" id="e_n"></div><div class="row"><button class="btn" type="submit">Post alert</button></div></form></div>`; }
function postAlert(e){ e.preventDefault(); const t = val("nT"), b = val("nB"), s = val("nS"); if (!t || !b){ $("#e_n").textContent = "Add a headline and details."; return; } if (s && !/^https:\/\//.test(s)){ $("#e_n").textContent = "Source links must start with https://"; return; }
  S.alerts.unshift({ id:uid(), level:val("nL"), title:t, body:b, src:s, date:today(), topic:val("nTp") }); audit(`Posted ${val("nL")} alert "${t}"`); if (S.alertCfg.on && S.alertCfg.topics.includes(val("nTp"))) notify(`New alert: ${t}`); save(); render(); toast("Alert posted"); }
ACT.alertDel = a => { const al = S.alerts.find(x => x.id === a.dataset.id); S.alerts = S.alerts.filter(x => x !== al); audit(`Removed alert "${al.title}"`); save(); render(); toast("Alert removed"); };
function admAudit(){ return `<p class="muted small">Read-only. Nobody, including administrators, can edit or delete entries.</p><div class="panel scroll"><table class="stack"><thead><tr><th>When</th><th>Who</th><th>Action</th></tr></thead><tbody>${S.audit.map(a => `<tr><td class="nowrap small">${a.at}</td><td class="nowrap">${esc(a.who)}</td><td>${esc(a.act)}</td></tr>`).join("")}</tbody></table></div>`; }

/* ================= notifications ================= */
$("#bell").onclick = e => { e.stopPropagation(); const n = $("#notif"); n.hidden = !n.hidden; $("#bell").setAttribute("aria-expanded", !n.hidden);
  n.innerHTML = `<div class="row" style="margin:6px 0"><b>Notifications</b><span class="sp"></span><button class="btn ghost sm" data-act="readAll">Mark all read</button></div><ul class="list">${S.notifs.slice(0, 8).map(x => `<li style="padding:10px 0" class="small">${x.read ? "" : `<span class="pill p-red" style="margin-right:6px">New</span>`}${esc(x.t)}<div class="tiny muted">${fmtD(x.at)}</div></li>`).join("") || `<li class="muted small">Nothing yet.</li>`}</ul>`; };
ACT.readAll = () => { S.notifs.forEach(x => x.read = true); save(); $("#notif").hidden = true; renderChrome(route()); };
document.addEventListener("click", e => { if (!e.target.closest("#notif") && !e.target.closest("#bell")) $("#notif").hidden = true; });

/* ================= boot ================= */
/* Localised content: lessons, quiz, practice messages, videos, badges and tutor answers are swapped in whole (see i18n.js),
   so highlighted phrases stay inside grammatical sentences. English originals are kept in BASE. */
const BASE = JSON.parse(JSON.stringify({ MODULES, QUESTIONS, SIM_BANK, VIDEOS, BADGE_DEFS, FAQ_A:FAQ.map(f => f[1]), SUGG }));
const FAQ_MISS = { es:"Puedo ayudarte con preguntas sobre phishing y sobre cómo usar Phish Net: el Laboratorio, el cuestionario, los certificados, los reportes o qué hacer si hiciste clic en algo. ¿Puedes reformular tu pregunta?", vi:"Mình có thể giúp bạn về lừa đảo phishing và cách dùng Phish Net: Phòng thử nghiệm, câu đố, chứng chỉ, báo cáo, hoặc phải làm gì nếu bạn lỡ bấm vào thứ gì đó. Bạn có thể hỏi lại theo cách khác không?" };
function applyContent(){ const C = (S.lang !== "en" && window.PN_CONTENT && window.PN_CONTENT[S.lang]) || {};
  MODULES.forEach((m, i) => { const b = BASE.MODULES[i], o = (C.modules || {})[m.id] || {}; ["t","s","how","signs","lessons"].forEach(k => m[k] = o[k] ?? b[k]); m.ex = { ...b.ex, ...(o.ex || {}) }; });
  QUESTIONS.forEach((q, i) => { const b = BASE.QUESTIONS[i], o = (C.questions || [])[i] || {}; ["q","o","e"].forEach(k => q[k] = o[k] ?? b[k]); });
  SIM_BANK.forEach((m, i) => { const b = BASE.SIM_BANK[i], o = (C.sim || {})[m.id] || {}; ["from","subj","body","why","flags","time"].forEach(k => m[k] = o[k] ?? b[k]); });
  VIDEOS.forEach((v, i) => { const b = BASE.VIDEOS[i], o = (C.videos || {})[v.id] || {}; ["t","topic","caps","guide"].forEach(k => v[k] = o[k] ?? b[k]); });
  BADGE_DEFS.forEach((d, i) => { const o = (C.badges || {})[d[0]], b = BASE.BADGE_DEFS[i]; d[1] = o ? o[0] : b[1]; d[2] = o ? o[1] : b[2]; });
  FAQ.forEach((f, i) => f[1] = (C.faq || [])[i] ?? BASE.FAQ_A[i]); SUGG.splice(0, SUGG.length, ...(C.sugg || BASE.SUGG)); }
let SAMPLE_FN = null, DL = null;
applyContent();
LAST = route(); render();
if (window.claude && window.claude.use){
  claude.use("sample").then(s => { SAMPLE_FN = s; if (["tutor","lab"].includes(route())) render(); }).catch(() => {});
  claude.use("downloads").then(d => { DL = d; }).catch(() => {});
}
}
</script>
</body>
