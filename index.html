<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phish Net</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Schibsted+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, trustworthy safety trainer; plain words, no fear-mongering.
   IDEA: a harbour safety station: deep-water header, a knotted net that "catches" red flags.
   PICTURE: the live "spot the red flags" email sitting in a net on the home screen; every tool is itself the picture.
   COLOUR and TYPE: deep sea teal ground, signal-flag red for danger, rope tan accent; Schibsted Grotesk + Atkinson Hyperlegible (readability requirement).
   LAYOUT: app shell, sticky deep header, one working panel per screen, stacks under 600px. */
:root{color-scheme:light dark;
  --bg:light-dark(#F2F6F5,#0A181B);--paper:light-dark(#FFFFFF,#10252A);--ink:light-dark(#0F2E33,#E4EFEC);--ink2:light-dark(#4A6461,#9DB5B1);
  --line:light-dark(#D3E0DC,#22403F);--rope:light-dark(#94661F,#D9AC62);--rope-s:light-dark(#F4E8D2,#3A2F1C);
  --flag:light-dark(#C42638,#F06372);--flag-s:light-dark(#FBE3E5,#3D1A1F);--ok:light-dark(#22704F,#5BC497);--ok-s:light-dark(#DDF0E6,#16362A);
  --warn:light-dark(#9A6500,#E5B640);--warn-s:light-dark(#FBEFCF,#3A2F10);--deep:#0F2E33;--deep2:#163E44;--on-deep:#EAF3F0;
  --r:8px;--R:14px;--disp:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 var(--body);overflow-x:clip}
h1,h2,h3{font-family:var(--disp);line-height:1.1;margin:0 0 .45em;text-wrap:balance}
h1{font-size:clamp(1.9rem,4vw,2.9rem);font-weight:800}h2{font-size:clamp(1.35rem,2.4vw,1.75rem);font-weight:700}h3{font-size:1.12rem;font-weight:700}
p{margin:0 0 .8em;max-width:70ch}a{color:inherit;text-underline-offset:3px;text-decoration-color:var(--rope)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rope);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(3vw,16px)}
.muted{color:var(--ink2)}.small{font-size:.9rem}.tiny{font-size:.8rem}.right{text-align:right}.nowrap{white-space:nowrap}
.scroll{overflow-x:auto}
/* header */
header.top{position:sticky;top:0;z-index:30;background:var(--deep);color:var(--on-deep)}
.bar{display:flex;align-items:center;gap:14px;min-height:62px}
.brand{display:flex;align-items:center;gap:9px;font:800 1.3rem var(--disp);color:var(--on-deep);text-decoration:none;white-space:nowrap}
.brand svg{width:30px;height:30px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;padding:9px 11px;border-radius:6px;color:#A9C4C0;font-weight:700;text-decoration:none;white-space:nowrap;font-size:.95rem}
nav.tabs a:hover{color:#fff;background:var(--deep2)}nav.tabs a.on{color:#fff;box-shadow:inset 0 -3px 0 #D9AC62;border-radius:0}
.tools{display:flex;align-items:center;gap:8px}
.lang{display:flex;border:1px solid #2E5A60;border-radius:999px;overflow:hidden}
.lang button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:.8rem;font-weight:700;color:#A9C4C0;min-height:32px}
.lang button[aria-pressed=true]{background:var(--on-deep);color:var(--deep)}
.iconbtn{position:relative;border:0;background:none;color:var(--on-deep);width:40px;height:40px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.iconbtn:hover{background:var(--deep2)}.dot{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--flag);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 .8rem var(--disp);background:#D9AC62;color:#0F2E33;flex:none}
.chipbtn{display:flex;align-items:center;gap:8px;border:1px solid #2E5A60;background:none;color:var(--on-deep);padding:4px 12px 4px 4px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.9rem}
.urgent{background:var(--flag);color:#fff;font-size:.92rem}.urgent .wrap{display:flex;gap:10px;align-items:center;padding-block:8px}.urgent b{white-space:nowrap}
/* generic */
main{padding:28px 0 120px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--R);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:22px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--ink);color:var(--bg);padding:10px 18px;min-height:44px;border-radius:var(--r);font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.88rem}.btn.danger{background:var(--flag);color:#fff}.btn.okb{background:var(--ok);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sp{flex:1}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:.95rem}
input[type=text],input[type=email],input[type=password],input[type=url],input[type=number],input[type=date],input[type=search],textarea,select{width:100%;padding:10px 12px;min-height:44px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--ink);outline:none}
textarea{min-height:110px;resize:vertical}
.err{color:var(--flag);font-size:.86rem;margin-top:4px;min-height:0}
.hint{font-size:.85rem;color:var(--ink2);margin-top:4px}
.check{display:flex;gap:10px;align-items:center;font-weight:400;margin:8px 0}.check input{width:20px;height:20px;accent-color:var(--ink)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 20px}
.tabgrp .sub{margin:4px 0 14px}.tabgrp>span{font-weight:700}
.sub button{border:1px solid var(--line);background:var(--paper);padding:8px 14px;min-height:40px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--ink2)}
.sub button[aria-pressed=true]{border-color:var(--ink);color:var(--bg);background:var(--ink)}
.pill{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--line);color:var(--ink)}
.p-red{background:var(--flag-s);color:var(--flag)}.p-ok{background:var(--ok-s);color:var(--ok)}.p-warn{background:var(--warn-s);color:var(--warn)}.p-rope{background:var(--rope-s);color:var(--rope)}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:var(--R);color:var(--ink2)}
.list{list-style:none;margin:0;padding:0}.list>li{padding:14px 0;border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.84rem;color:var(--ink2);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:var(--rope-s)}
.crumb{font-size:.9rem;margin-bottom:10px}.crumb button{border:0;background:none;padding:0;color:var(--ink2);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.bars .b{display:grid;grid-template-columns:150px minmax(0,1fr) 54px;gap:10px;align-items:center;margin:8px 0;font-size:.92rem}
.bars .t{height:14px;background:var(--line);border-radius:7px;overflow:hidden}.bars .t i{display:block;height:100%;background:var(--rope);border-radius:7px}
.bars .b.hi .t i{background:var(--flag)}
.meter{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ok);transition:width .4s}
/* home */
.hero{background:var(--deep);color:var(--on-deep);margin:-28px calc(50% - 50vw) 34px;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:36px;padding-block:44px 52px;align-items:center;position:relative}
@media(max-width:860px){.hero .wrap{grid-template-columns:1fr}}
.hero h1{color:#fff}.hero p{color:#C3D7D3;font-size:1.08rem}.hero .specimen p{color:#1B2B2E;font-size:.98rem}
.netbg{position:absolute;inset:0;opacity:.13;pointer-events:none}
.flagcount{display:flex;gap:7px;margin:16px 0 6px}.flagcount span{width:36px;height:10px;border-radius:5px;background:#2E5A60;transition:background .3s}.flagcount span.on{background:#F06372}
.found{list-style:none;margin:12px 0 0;padding:0}.found li{border-left:3px solid #F06372;padding:6px 0 6px 12px;margin-bottom:8px;color:#DCE9E6;font-size:.95rem}.found b{display:block;color:#fff}
.specimen{background:#fff;color:#1B2B2E;border-radius:var(--R);overflow:hidden;box-shadow:0 30px 60px -25px rgba(0,0,0,.6);transform:rotate(.6deg)}
.spec-bar{display:flex;gap:6px;padding:10px 14px;background:#EEF2F1;border-bottom:1px solid #DCE4E2}.spec-bar i{width:10px;height:10px;border-radius:50%;background:#C9D3D1}
.spec-head{padding:14px 20px;border-bottom:1px solid #E4EAE8;font-size:.93rem}.spec-head div{margin:2px 0}
.spec-body{padding:18px 20px 22px;font-size:.98rem}
.hot{all:unset;cursor:pointer;border-radius:3px;padding:0 2px;margin:0 -2px;transition:background .2s}
.hot:hover{background:#FBEFCF}.hot:focus-visible{outline:2px dashed #94661F}
.hot.got{background:#FBE3E5;box-shadow:inset 0 -2px 0 #C42638}
.hot.btnlike{display:inline-block;background:#1E5FB8;color:#fff;padding:10px 20px;margin:4px 0;border-radius:4px;font-weight:700}.hot.btnlike.got{background:#C42638}
.tip{font:.78rem ui-monospace,Menlo,monospace;color:#5B6B6E;min-height:1.2em;margin-top:4px}
.attach{display:inline-flex;gap:8px;align-items:center;border:1px solid #DCE4E2;border-radius:6px;padding:7px 12px;margin-top:8px}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.pillar{background:var(--paper);border:1px solid var(--line);border-radius:var(--R);padding:22px;display:flex;flex-direction:column}
.pillar .k{font:800 .9rem var(--disp);color:var(--rope);margin-bottom:6px}
.pillar ul{padding-left:18px;margin:4px 0 14px;color:var(--ink2)}.pillar .btn{margin-top:auto;align-self:flex-start}
.statline{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--R);overflow:hidden}
.stat{background:var(--paper);padding:16px 18px}.stat .v{font:800 clamp(1.5rem,3vw,2rem)/1.1 var(--disp);white-space:nowrap}.stat .k{color:var(--ink2);font-size:.9rem}
/* dashboard */
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:18px}
.card h3{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;background:var(--paper);font-size:.88rem}
.badge.locked{opacity:.5;filter:grayscale(1)}.badge svg{width:44px;height:44px;display:block;margin:0 auto 6px}
.badge b{display:block}.badge .btn{margin-top:8px}
.custom li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
/* learn */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px}
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--R);padding:18px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left}
.tcard:hover{border-color:var(--ink)}.tcard .top{display:flex;gap:12px;align-items:center}
.mono{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font:800 .95rem var(--disp);background:var(--deep);color:#D9AC62;flex:none}
.tcard .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:8px;font-size:.85rem;color:var(--ink2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.filters>*{flex:1 1 180px}
.example{border:1px solid var(--line);border-radius:var(--R);overflow:hidden;background:#fff;color:#1B2B2E}
.example .h{background:#EEF2F1;padding:12px 16px;font-size:.9rem;border-bottom:1px solid #DCE4E2}.example .b{padding:16px}
mark.f{background:#FBE3E5;color:#1B2B2E;box-shadow:inset 0 -2px 0 #C42638;padding:0 2px;border-radius:2px}
mark.f sup{color:#C42638;font-weight:700;margin-left:2px}
.steps{display:flex;gap:6px;margin:10px 0 18px;flex-wrap:wrap}.steps span{flex:1 1 40px;height:6px;border-radius:3px;background:var(--line)}.steps span.v{background:var(--ok)}.steps span.c{background:var(--rope)}
.lesson{font-size:1.05rem}.lesson .tipbox{border-left:4px solid var(--rope);background:var(--rope-s);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;margin:12px 0}
.player{aspect-ratio:16/9;background:var(--deep);border-radius:var(--R);display:grid;place-items:center;color:#fff;position:relative;overflow:hidden}
.player .pb{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:linear-gradient(transparent,rgba(0,0,0,.6));display:flex;gap:10px;align-items:center}
.player .pb .meter{flex:1;background:rgba(255,255,255,.25)}.player .pb .meter i{background:#D9AC62}
.cap{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:4px 10px;border-radius:4px;font-size:.9rem;max-width:90%;text-align:center}
.guide{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:var(--R);padding:18px;background:var(--paper)}
/* verdict */
.verdict{margin-top:16px;border-radius:var(--R);padding:16px 18px;border:1.5px solid}
.verdict h3{margin-bottom:6px}.verdict ul{margin:6px 0 0;padding-left:20px}
.v-danger{background:var(--flag-s);border-color:var(--flag)}.v-danger h3{color:var(--flag)}
.v-warn{background:var(--warn-s);border-color:var(--warn)}.v-warn h3{color:var(--warn)}
.v-safe{background:var(--ok-s);border-color:var(--ok)}.v-safe h3{color:var(--ok)}
.ai-out{margin-top:12px;padding:14px 16px;border-left:3px solid var(--rope);background:var(--bg);border-radius:0 var(--r) var(--r) 0;white-space:pre-wrap}
/* inbox */
.inbox{display:grid;grid-template-columns:minmax(220px,2fr) minmax(0,5fr);border:1px solid var(--line);border-radius:var(--R);overflow:hidden;background:var(--paper);min-height:460px;position:relative}
@media(max-width:760px){.inbox{grid-template-columns:1fr}}
.mlist{border-right:1px solid var(--line);overflow:auto;max-height:560px}
.mi{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 14px;cursor:pointer}
.mi:hover{background:var(--bg)}.mi[aria-selected=true]{background:var(--bg);box-shadow:inset 3px 0 0 var(--rope)}
.mi b{display:block;font-size:.93rem}.mi span{font-size:.84rem;color:var(--ink2)}.mi .pill{float:right}
.mview{padding:18px 20px;overflow:auto}.mview .meta{font-size:.9rem;color:var(--ink2);border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.simlink{color:#1E5FB8;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0;font-weight:700}
.status{position:absolute;left:0;bottom:0;background:#E9EEED;color:#333;font:.78rem ui-monospace,Menlo,monospace;padding:3px 10px;border-top-right-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* quiz */
.quiz{max-width:760px}.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media(max-width:900px){.qwrap{grid-template-columns:1fr}}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:var(--r);padding:12px 16px;min-height:48px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}.opt.sel{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-s)}.opt.wrong{border-color:var(--flag);background:var(--flag-s)}
.explain{padding:12px 16px;background:var(--bg);border-radius:var(--r);margin:10px 0}
.notes{position:sticky;top:80px;max-height:70vh;overflow:auto}
/* community */
.post{padding:16px 0;border-bottom:1px solid var(--line)}
.who{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;color:var(--ink2)}.who .av{width:24px;height:24px;font-size:.65rem}
.vote{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;min-height:36px;cursor:pointer;font-weight:700}
.vote.on{border-color:var(--rope);background:var(--rope-s);color:var(--rope)}
.replies{margin:10px 0 0 10px;padding-left:14px;border-left:2px solid var(--line)}.replies>div{padding:6px 0}
.stars{display:flex;gap:2px}.stars button{background:none;border:0;font-size:1.7rem;cursor:pointer;color:var(--line);padding:0 2px;line-height:1;min-width:36px;min-height:40px}
.stars button.on{color:var(--rope)}.stars.sm button{font-size:1.2rem;min-width:26px;min-height:30px}
.alert{border-left:4px solid var(--warn);padding:12px 16px;margin-bottom:12px;background:var(--paper);border-radius:0 var(--r) var(--r) 0}.alert.urg{border-left-color:var(--flag)}
/* tools */
.parts{display:flex;flex-wrap:wrap;font:.95rem ui-monospace,Menlo,monospace;margin:12px 0;word-break:break-all}
.parts span{padding:6px 4px;border-bottom:4px solid var(--line)}.parts .rd{border-color:var(--flag);background:var(--flag-s);font-weight:700}.parts .sd{border-color:var(--warn)}.parts .pa{border-color:var(--ink2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink2)}.legend i{display:inline-block;width:14px;height:4px;margin-right:6px;vertical-align:middle}
/* modal, toast, chat, demo bar */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(5,15,17,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.scrim[hidden]{display:none}
.modal{background:var(--paper);color:var(--ink);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:var(--R);padding:22px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.modal.wide{width:min(820px,100%)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:90;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.demo{position:fixed;left:12px;bottom:12px;z-index:50;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;display:flex;align-items:center;gap:6px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);font-size:.82rem;max-width:calc(100vw - 100px);overflow-x:auto}
.demo b{white-space:nowrap}.demo button{border:0;background:none;padding:6px 10px;border-radius:999px;cursor:pointer;font-weight:700;color:var(--ink2);white-space:nowrap;min-height:34px}
.demo button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.fab{position:fixed;right:14px;bottom:12px;z-index:50;border:0;border-radius:999px;background:var(--rope);color:#fff;padding:13px 18px;font-weight:700;cursor:pointer;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);min-height:48px}
.chat{position:fixed;right:14px;bottom:72px;z-index:55;width:min(390px,calc(100vw - 28px));height:min(540px,72vh);background:var(--paper);border:1px solid var(--line);border-radius:var(--R);display:flex;flex-direction:column;box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
.chat[hidden]{display:none}
.chathead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.log{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;font-size:.95rem}.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg)}.msg.a{align-self:flex-start;background:var(--bg)}
.chat form,.tutor form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}.sugg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:.84rem}
.notif{position:absolute;right:max(3vw,16px);top:60px;width:min(360px,calc(100vw - 32px));background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:var(--R);box-shadow:0 20px 50px -20px rgba(0,0,0,.45);padding:8px 16px;z-index:40}
.notif[hidden]{display:none}
.qr{width:168px;height:168px;background:#fff;padding:8px;border-radius:8px}
.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font:1rem ui-monospace,Menlo,monospace;background:var(--bg);padding:14px;border-radius:var(--r)}
.cert{background:#FFFDF8;color:#1B2B2E;border:10px solid #0F2E33;outline:2px solid #94661F;outline-offset:-18px;padding:34px;text-align:center;border-radius:4px}
.cert h2{font-size:1.9rem;margin:10px 0}.cert .nm{font:800 2rem var(--disp);border-bottom:2px solid #94661F;display:inline-block;padding:0 20px 4px;margin:8px 0 14px}
footer{border-top:1px solid var(--line);padding:24px 0 90px;color:var(--ink2);font-size:.9rem}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--ink2);font-weight:700}.stack td:empty{display:none}.bars .b{grid-template-columns:100px minmax(0,1fr) 44px}.chipbtn span.n{display:none}}
@media(max-width:820px){.bar{flex-wrap:wrap;gap:6px 12px;padding-top:8px}.bar .tools{margin-left:auto}nav.tabs{order:3;flex:1 1 100%;padding-bottom:4px}}
@media(max-width:440px){.brand{font-size:1.1rem;gap:6px}.brand svg{width:26px;height:26px}.lang button{padding:5px 7px}.tools{gap:4px}.iconbtn{width:36px;height:36px}.chipbtn{padding:3px}.urgent .wrap{flex-wrap:wrap;gap:2px 10px}}
@media(max-width:600px){.dashhead .sp{flex-basis:100%}.demo b{margin-right:4px}.fab{bottom:62px;padding:10px 14px;min-height:42px;font-size:.9rem}.chat{bottom:112px}.demo{max-width:calc(100vw - 24px);font-size:.78rem}.demo button{padding:6px 8px}.toast{bottom:120px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.specimen{transform:none}}

<script>
/* Phish Net translations: Spanish (es) and Vietnamese (vi). Generated by src/build.py; edit the files in src/. */
window.PN_CONTENT = {
es: {
 modules: {
  m1: { t:"Phishing por correo", s:"Correos masivos que se hacen pasar por una empresa de confianza.",
   how:"Los atacantes copian el logo y el tono de una marca real y envían el mismo mensaje a miles de bandejas, con la esperanza de que algunas personas hagan clic sin pensar.",
   signs:["El dominio del remitente no coincide con la empresa","Fecha límite urgente o amenaza","Saludo genérico como \"Estimado cliente\"","Botón o enlace que lleva a otra dirección","Archivo adjunto inesperado"],
   ex:{ subj:"Tu cuenta ha sido limitada", body:"[[Estimado cliente|Saludo genérico]], detectamos actividad inusual. [[Restablece el acceso en 24 horas|Presión con fecha límite]] o tu cuenta será cerrada. [[Resolver ahora|El enlace va a paypa1-billing.com, no a paypal.com]]" },
   lessons:[["Qué es el phishing por correo","Un correo de phishing imita a una empresa que ya usas: un banco, una paquetería, tu universidad. El objetivo es que inicies sesión en una página falsa, pagues algo o abras un archivo.","La mayoría del phishing es un juego de números. No necesita engañar a todos, solo a unas pocas personas ocupadas o preocupadas."],
    ["Lee el remitente real","El nombre visible (\"PayPal Service\") es texto libre que cualquiera puede escribir. Lo que importa es la dirección que sigue y, sobre todo, el dominio: la parte justo antes de .com u .org.","En el teléfono, toca el nombre del remitente para ver la dirección completa."],
    ["Enlaces y archivos adjuntos","Pasa el cursor sobre un enlace (o mantenlo presionado en el móvil) para ver adónde lleva realmente. Los adjuntos que terminan en .exe, .js, .html o con doble extensión como .pdf.exe son programas, no documentos.","Si tienes dudas, no hagas clic. Abre tú mismo el sitio o la app de la empresa."]] },
  m2: { t:"Phishing dirigido (spear phishing)", s:"Un mensaje escrito para ti, con datos reales sobre ti.",
   how:"El atacante te investiga primero: tu universidad, el nombre de tu jefe, una compra reciente. Como se siente personal, evade las alarmas habituales.",
   signs:["Usa tu nombre, tu puesto o tu actividad reciente","La petición es inusual para esa persona","Te pide saltarte el proceso normal","Viene de una imitación de la dirección de un colega real"],
   ex:{ subj:"Re: archivos del proyecto CSIT 416", body:"Hola Alex, como hablamos en clase, por favor [[revisa la rúbrica actualizada|Un profesor usaría su correo universitario, no Gmail]] antes del viernes: [[rubric-416.html|Un adjunto .html puede abrir una página de inicio de sesión falsa]]" },
   lessons:[["Por qué lo personal parece seguro","El phishing dirigido toma contexto real de redes sociales, directorios escolares o filtraciones de datos. Cuanto más sabe un mensaje sobre ti, más confiable parece, y ese es justamente el truco.","La información pública no prueba la identidad de nadie."],
    ["Verifica por otro canal","Si un mensaje te pide algo inusual, confírmalo con datos de contacto que ya tengas: un número de teléfono, el portal oficial o en persona.","Nunca verifiques respondiendo al mismo mensaje."],
    ["Reduce tu huella","Limita lo que es público en tus perfiles: tu horario, detalles de tu trabajo y a quién reportas. Los atacantes usan esto para crear historias convincentes.","Revisa tu configuración de privacidad una vez por semestre."]] },
  m3: { t:"Smishing", s:"Phishing por mensaje de texto.",
   how:"Los SMS muestran menos detalles que el correo, así que los enlaces falsos son más difíciles de revisar. Los problemas de entrega, peajes impagos y alertas bancarias son las historias más comunes.",
   signs:["Problema inesperado con una entrega, un peaje o el banco","Enlace acortado o extraño","Te pide responder con un código","Viene de un número o correo desconocido"],
   ex:{ subj:"Mensaje de texto", body:"USPS: [[Tu paquete está retenido|Gancho de entrega]] por una dirección incompleta. Actualízala [[en 12 horas|Presión con fecha límite]]: [[usps-redelivery.top/track|No es usps.com, y .top es una terminación común en estafas]]" },
   lessons:[["Las historias más comunes","Paquete retenido, peaje impago, cargo bancario sospechoso, premio de un sorteo en el que no participaste. Todas te empujan a tocar un enlace ya.","Las paqueterías reales rara vez envían enlaces por SMS si no te suscribiste a alertas."],
    ["Nunca compartas códigos","Un código de un solo uso que te llega por SMS es la llave de tu cuenta. Ninguna empresa real te pedirá que se lo leas.","Si alguien te pide un código, es una estafa, siempre."],
    ["Qué hacer en su lugar","No toques el enlace. Abre la app oficial o escribe tú mismo la dirección del sitio. Reenvía los SMS fraudulentos al 7726 (SPAM) para reportarlos a tu operador.","Luego borra el mensaje."]] },
  m4: { t:"Vishing", s:"Phishing por llamada telefónica o buzón de voz.",
   how:"Quienes llaman se hacen pasar por tu banco, soporte técnico o una agencia del gobierno, a menudo con un identificador de llamadas falsificado. La clonación de voz con IA ya puede imitar a personas que conoces.",
   signs:["El identificador muestra un nombre de confianza","Presión para actuar durante la llamada","Pide códigos, contraseñas o acceso remoto","Amenaza con arresto, multas o cierre de la cuenta"],
   ex:{ subj:"Llamada perdida: \"Chase Fraud Dept\"", body:"Le habla el departamento de fraude de Chase. [[Hemos congelado su tarjeta|Provoca miedo]]. [[Devuélvanos la llamada de inmediato|Urgencia]] al 1-888-555-0110 y tenga a mano su [[contraseña de banca en línea|Los bancos nunca piden tu contraseña]]." },
   lessons:[["El identificador de llamadas puede mentir","Los estafadores pueden hacer que cualquier nombre o número aparezca en tu pantalla. Un identificador conocido no es prueba de nada.","Trata como no verificadas las llamadas inesperadas sobre dinero o cuentas."],
    ["Cuelga y vuelve a llamar","Termina la llamada y marca el número impreso en tu tarjeta o en el sitio oficial. Un banco real lo entenderá.","Nunca uses un número que te dé quien llama."],
    ["Clonación de voz","Unos segundos de audio pueden bastar para clonar una voz. Acuerda una palabra clave familiar para emergencias.","Si un ser querido te llama pidiendo dinero, cuelga y llámalo tú."]] },
  m5: { t:"Compromiso del correo empresarial", s:"Hacerse pasar por un jefe o proveedor para mover dinero.",
   how:"Un \"director\" pide tarjetas de regalo, o un \"proveedor\" envía nuevos datos bancarios para una factura. Estos mensajes a menudo no tienen enlaces, así que los filtros no los detectan.",
   signs:["Pide tarjetas de regalo o una transferencia","Datos de pago nuevos o cambiados","Pide discreción","Enviado desde una dirección personal o imitada"],
   ex:{ subj:"Un favor rápido", body:"¿Estás en tu escritorio? Necesito que [[compres 5 tarjetas de regalo de Apple|Las tarjetas de regalo son un pago imposible de rastrear]] para un cliente. [[Que quede entre nosotros|Pide discreción]] por ahora, estoy en reuniones todo el día." },
   lessons:[["Dinero sin malware","Este fraude se basa en la autoridad y la rutina, no en enlaces maliciosos. Por eso causa algunas de las mayores pérdidas de cualquier tipo de estafa.","Los filtros no pueden atrapar lo que parece un mensaje normal."],
    ["Los cambios de pago requieren una llamada","Cualquier cambio de datos bancarios o pago inusual debe confirmarse por teléfono con un número que ya tenías registrado.","Hazlo parte del proceso del equipo para que nadie se sienta grosero."],
    ["Las tarjetas de regalo lo delatan","Ningún jefe legítimo paga a clientes con tarjetas de regalo. Pedirlas, sobre todo con discreción, es una señal fuerte de estafa.","Repórtalo a TI o a seguridad de inmediato."]] },
  m6: { t:"Phishing por clonación", s:"Una copia de un correo real que recibiste, con el enlace cambiado.",
   how:"El atacante toma un mensaje legítimo, como un documento compartido o un recibo, y lo reenvía como una \"versión actualizada\" con un enlace o adjunto malicioso.",
   signs:["Duplicado de un correo que ya recibiste","Dice \"reenvío\" o \"versión actualizada\"","El enlace apunta a un dominio distinto del original"],
   ex:{ subj:"REENVIADO: Contrato de arrendamiento listo para firmar", body:"[[Le reenviamos este documento|Clon de un mensaje real anterior]] porque el enlace anterior caducó. [[Revisar documento|docusign-mail.review no es docusign.net]]" },
   lessons:[["Por qué funcionan los clones","Reconoces el mensaje, así que te relajas. El atacante cuenta con esa familiaridad.","Una segunda copia que no esperabas es razón para mirar con más cuidado, no menos."],
    ["Compáralo con el original","Abre el primer correo y compara la dirección del remitente y el destino del enlace. Cualquier diferencia es una señal de alerta.","Busca el original en tu bandeja antes de hacer clic."],
    ["Ve a la fuente","Para firmas y archivos compartidos, abre el servicio directamente y revisa ahí tus pendientes.","Las solicitudes reales estarán esperándote en tu cuenta."]] },
  m7: { t:"Quishing", s:"Códigos QR maliciosos.",
   how:"Los códigos QR en parquímetros, volantes o correos pueden llevar a páginas falsas de pago o de inicio de sesión. Como no puedes leer un QR a simple vista, oculta el destino.",
   signs:["Calcomanía pegada sobre un código original","Código QR en un correo que te pide iniciar sesión","Página de pago que no coincide con el operador"],
   ex:{ subj:"Escanea para mantener activa tu MFA", body:"Tu configuración de autenticación multifactor vence hoy. [[Escanea este código QR con tu teléfono|Te lleva a un dispositivo con menos protección]] para volver a inscribirte. [[Si no cumples, tu cuenta será bloqueada|Amenaza]]." },
   lessons:[["Un enlace que no puedes ver","Un código QR es solo un enlace. Al escanearlo con el teléfono te alejas de los filtros de correo de tu computadora.","La app de la cámara suele mostrar la dirección antes de abrirla. Léela."],
    ["Calcomanías en parquímetros","Los estafadores pegan su propio código sobre los reales en parquímetros y mesas de restaurantes.","Usa la app oficial del operador o escribe la dirección que aparece en el letrero."],
    ["Códigos QR en el correo","Los equipos de TI reales rara vez te piden escanear un código para iniciar sesión. Trátalo como cualquier otro enlace inesperado.","Repórtalo en lugar de escanearlo."]] },
  m8: { t:"Phishing en redes sociales", s:"Cuentas de soporte falsas y mensajes directos.",
   how:"Cuando te quejas públicamente con una empresa, cuentas de \"soporte\" falsas responden y te piden que envíes por mensaje directo tus datos de acceso o que hagas clic en un enlace de ayuda.",
   signs:["La cuenta de soporte no está verificada","Pide contraseñas o códigos por mensaje directo","Premio o sorteo en el que no participaste","Cuenta nueva con pocos seguidores"],
   ex:{ subj:"Mensaje directo", body:"¡Lamentamos tu problema de facturación! [[Por favor verifica tu cuenta aquí|El soporte real nunca te pide iniciar sesión por mensaje directo]]: [[netflix-help-desk.co/verify|No es netflix.com]]. [[Fíjate en la I mayúscula del usuario|NetfIix usa una I mayúscula en lugar de una l]]." },
   lessons:[["Cuentas de soporte falsas","Los atacantes vigilan las quejas públicas y responden rápido con un nombre de usuario parecido.","Busca la insignia de verificación y la antigüedad de la cuenta."],
    ["Nunca inicies sesión por mensaje directo","El soporte real nunca te pedirá tu contraseña ni un código en un mensaje.","Contacta al soporte desde el sitio o la app oficial de la empresa."],
    ["Sorteos y premios","Los mensajes de \"¡Ganaste!\" de cuentas que no sigues son una forma común de recopilar datos personales.","Si no participaste, no ganaste."]] }
 },
 questions: [
  { q:"¿Qué parte de esta dirección indica quién es realmente el dueño del sitio? https://login.paypal.com.secure-check.net/account", o:["login","paypal.com","secure-check.net","account"], e:"El dominio registrado es la parte justo antes de la terminación, aquí secure-check.net. Todo lo que está a su izquierda es un subdominio al que el dueño puede ponerle cualquier nombre." },
  { q:"Un SMS dice que tu paquete está retenido y te pide actualizar tu dirección mediante un enlace. ¿Qué es lo mejor?", o:["Tocar el enlace y revisar","Responder STOP","Abrir tú mismo la app o el sitio de la paquetería con tu número de rastreo","Reenviárselo a un amigo para preguntarle"], e:"Ir tú mismo al sitio oficial evita por completo el enlace del atacante." },
  { q:"Tu \"director\" te escribe desde una dirección de Gmail pidiéndote comprar tarjetas de regalo con urgencia y en secreto. Esto es:", o:["Normal en directivos ocupados","Compromiso del correo empresarial","Spam inofensivo","Phishing por clonación"], e:"Hacerse pasar por un líder para mover dinero, con discreción y urgencia, es compromiso del correo empresarial." },
  { q:"¿Qué garantiza el candado (https) en tu navegador?", o:["Que el sitio es seguro","Que el sitio pertenece a la marca que muestra","Que la conexión está cifrada","Que Google revisó el sitio"], e:"https solo cifra la conexión. Los sitios de phishing también obtienen certificados gratis." },
  { q:"Alguien llama diciendo que es de tu banco y te pide el código que te acaban de enviar por SMS. Debes:", o:["Leerle el código","Colgar y llamar al número de tu tarjeta","Darle solo la mitad del código","Pedirle que primero confirme tu dirección"], e:"Los códigos son llaves. Cuelga y contacta al banco por un número en el que ya confías." },
  { q:"¿Qué nombre de archivo adjunto es el más peligroso?", o:["Invoice_Oct.pdf","Notes.docx","Report.pdf.exe","Photo.jpg"], e:"Una doble extensión que termina en .exe es un programa disfrazado de documento." },
  { q:"¿Qué diferencia al phishing dirigido del phishing común?", o:["Se envía por teléfono","Está hecho a tu medida con datos personales","Siempre usa códigos QR","Solo ataca a empresas"], e:"El phishing dirigido se investiga y personaliza, lo que lo hace más convincente." },
  { q:"Recibes una segunda copia de un correo de DocuSign que dice \"reenviado, el enlace anterior caducó\". ¿Qué debes revisar primero?", o:["El logo","Si el dominio del enlace coincide con el original","La hora de llegada","El tipo de letra"], e:"El phishing por clonación cambia el enlace. Compara el destino con el mensaje original." },
  { q:"Un parquímetro tiene una calcomanía con un código QR encima del código impreso. ¿Qué es lo más seguro?", o:["Escanear la calcomanía","Escanear el código impreso de abajo","Usar la app oficial del operador o la dirección del letrero","Pagarle a alguien que pasa"], e:"Las calcomanías pueden tapar códigos reales. La app oficial o escribir la dirección evita ambos riesgos." },
  { q:"Una cuenta de soporte responde a tu queja pública y te pide tu contraseña por mensaje directo. Esto es:", o:["Soporte normal","Phishing en redes sociales","Una filtración de datos","Vishing"], e:"Las cuentas de soporte falsas que piden credenciales son phishing en redes sociales. El soporte real nunca pide contraseñas." }
 ],
 sim: {
  s1:{ from:"Mesa de ayuda de TI", subj:"Tu contraseña vence hoy", time:"8:02 a. m.", body:"Tu contraseña universitaria [[vence en 2 horas|Plazo de dos horas]]. Conserva el acceso confirmando tu [[contraseña actual|TI real nunca pide tu contraseña]] abajo.\n\n{{Conservar mi contraseña|https://campus-it-support.net/portal/confirm}}\n\nServicios de TI", flags:["El dominio del remitente campus-it-support.net no es el de la universidad"] },
  s2:{ subj:"Tu recibo de Spotify", time:"7:41 a. m.", body:"Gracias por tu pago.\n\nSpotify Premium Individual: $11.99\nPagado con Visa terminada en 4417 el 1 de nov. de 2026.\n\n¿Preguntas? Visita spotify.com/account en tu navegador.", why:"Enviado desde spotify.com, sin nada que pulsar, y te pide ir tú mismo al sitio." },
  s3:{ subj:"Jennifer compartió \"Q4 Bonus Schedule.pdf\"", time:"Ayer", body:"Jennifer Walsh te envió un documento para revisar y firmar: [[Calendario de bonos del 4.º trimestre|Nombre de archivo tentador]].\n\n{{Revisar documento|https://docusign-mail.review/sign?id=88412}}\n\n[[Este enlace vence en 24 horas.|Plazo corto]]", flags:["docusign-mail.review no es docusign.net"] },
  s4:{ from:"Maria Chen (directora)", subj:"Un favor rápido", time:"Ayer", body:"¿Estás en tu escritorio? Estoy en una reunión y necesito que [[compres 5 tarjetas de regalo de Apple ($200 cada una)|Pago con tarjetas de regalo]] para un cliente. Raspa el reverso y mándame fotos. [[Que quede entre nosotros por ahora.|Discreción]]", flags:["Una directiva usando una dirección personal de Gmail"] },
  s5:{ subj:"[GitHub] Se agregó una nueva clave SSH", time:"Lun", body:"Hola:\n\nSe agregó una nueva clave pública a tu cuenta. Si la agregaste tú, puedes ignorar este correo.\n\nSi no, abre GitHub tú mismo y revisa Settings > SSH keys.", why:"Enviado desde github.com, sin enlace para iniciar sesión, y te pide ir tú mismo al sitio. Es un aviso de seguridad real." },
  s6:{ subj:"No se pudo entregar el pedido #112-4471", time:"Lun", body:"[[Hola, cliente:|Saludo genérico]]\n\nTu método de pago fue rechazado. [[Actualiza tus datos de facturación|Pide datos de tarjeta]] para evitar la cancelación.\n\n{{Actualizar pago|http://amaz0n-orders.com/billing}}", flags:["\"amaz0n\" usa un cero","http en lugar de https"] },
  s7:{ subj:"E-ZPass: peaje impago", time:"Dom", body:"E-ZPass: Tienes un [[peaje impago de $4.15|Monto pequeño para que no lo pienses dos veces]]. Paga [[hoy para evitar un cargo por mora de $50|Amenaza de un cargo]]: {{ezpass-tollpay.top|https://ezpass-tollpay.top/pay}}", flags:["Las agencias de peaje no envían enlaces desde números al azar"] },
  s8:{ subj:"Alerta de Chase", time:"Dom", body:"Chase: Se hizo una compra de $42.18 en TRADER JOE'S con tu tarjeta terminada en 9921. Si no la reconoces, llama al número del reverso de tu tarjeta. Nunca te pediremos tu contraseña ni códigos.", why:"Sin enlace, un código corto que ya conoces, y te remite al número de tu tarjeta." },
  s9:{ subj:"Hola, ¿eres Emily?", time:"Sáb", body:"[[Hola, ¿eres Emily? Nos conocimos en la conferencia la semana pasada|Inicio de \"número equivocado\"]]. Mi tío me ha estado mostrando una [[app de criptomonedas con ganancias garantizadas del 30%|Las ganancias garantizadas son señal de estafa]], ¿quieres el enlace?", flags:["Los chats de \"número equivocado\" suelen convertirse en estafas de inversión"] },
  s10:{ from:"Ayuda Financiera de Montclair", subj:"Desembolso de primavera retenido", time:"Vie", body:"Estimado estudiante:\n\nTu desembolso de ayuda de primavera está retenido hasta completar la [[verificación de identidad|Petición creíble pero inesperada]]. Sube una foto de tu [[licencia de conducir y tarjeta del Seguro Social|Nunca envíes documentos de identidad por un enlace de correo]].\n\n{{Verificar identidad|https://montclair-edu.org/aid/verify}}", flags:["montclair-edu.org no es montclair.edu"] },
  s11:{ from:"Notificaciones de Canvas", subj:"CSIT 416: Tarea calificada", time:"Vie", body:"Tu entrega de \"Especificación de casos de uso\" fue calificada.\n\nAbre Canvas desde el portal de tu universidad para ver los comentarios.", why:"Enviado desde instructure.com (el dominio real de Canvas) y te pide abrir Canvas tú mismo." },
  s12:{ time:"Jue", body:"Verizon: Tu factura de $65.00 está lista. Consúltala en la app Mi Verizon. Responde HELP para ayuda o STOP para darte de baja.", why:"Código corto conocido, sin enlace, y te remite a la app oficial." }
 },
 videos: {
  v1:{ t:"Detecta al remitente falso en 3 minutos", topic:"Phishing por correo", caps:["Empieza por la dirección, no por el nombre.","El dominio es la parte antes de .com.","micros0ft no es microsoft."] },
  v2:{ t:"Smishing: los cinco SMS en los que nunca debes confiar", topic:"Smishing", caps:["¿Paquete retenido? Abre la app de la paquetería.","Nunca compartas un código de un solo uso.","Reenvía los SMS fraudulentos al 7726."] },
  v3:{ t:"Qué hacer en la primera hora después de hacer clic", topic:"Respuesta", guide:["Desconéctate si descargaste algo. Apaga el Wi-Fi para impedir que cualquier programa se comunique con el atacante.","Cambia la contraseña de la cuenta afectada desde otro dispositivo de confianza. Si la reutilizaste en algún lado, cámbiala también ahí.","Activa la verificación en dos pasos, preferiblemente con una app de autenticación o una llave de acceso en lugar de SMS.","Llama a tu banco al número de tu tarjeta si ingresaste datos de pago.","Repórtalo: al equipo de TI de tu escuela o trabajo, en reportfraud.ftc.gov y aquí en Phish Net para alertar a otros.","Vigila tus cuentas durante unas semanas. Los correos inesperados de restablecimiento de contraseña significan que alguien lo está intentando."] },
  v4:{ t:"El compromiso del correo empresarial, explicado", topic:"Compromiso del correo empresarial", caps:["Este fraude casi nunca tiene enlaces.","Las tarjetas de regalo lo delatan.","Confirma los cambios de pago por teléfono."] },
  v5:{ t:"Leer encabezados de correo sin miedo", topic:"Phishing por correo", guide:["Abre los encabezados completos: en Gmail usa el menú de tres puntos y luego \"Mostrar original\"; en Outlook elige \"Ver código fuente del mensaje\".","Busca Authentication-Results. SPF, DKIM y DMARC deberían decir pass en un remitente real.","Compara el dominio de From con Return-Path y Reply-To. Las diferencias merecen sospecha.","Un fallo de DMARC en una marca conocida es una señal fuerte de suplantación.","Pega los encabezados en el verificador de encabezados del Laboratorio para ver cada señal explicada."] }
 },
 badges: { hero:["Buen ojo","Encuentra las 5 señales en la página de inicio"], first:["Primer módulo","Completa un módulo de capacitación"], half:["A mitad de camino","Completa 4 módulos"], all:["Curso completo","Completa los 8 módulos"], quiz:["Cuestionario aprobado","Obtén 70% o más en el cuestionario"], ace:["Experto del cuestionario","Obtén 100% en el cuestionario"], sim:["Defensor de la bandeja","Aprueba una simulación del Laboratorio"], report:["Reportero","Envía tu primer reporte de phishing"], notes:["Toma notas","Guarda notas en un video o guía"], cert:["Certificado","Obtén tu certificado"] },
 faq: [
  "SPF comprueba que el servidor que envía tiene permiso para enviar en nombre de ese dominio. DKIM es una firma digital que prueba que el mensaje no se alteró y viene del dominio. DMARC indica a los receptores qué hacer cuando fallan. En el Laboratorio, el verificador de suplantación de correo explica cada resultado.",
  "Mantén la calma. 1) Cambia la contraseña de esa cuenta desde un dispositivo de confianza, y en cualquier lugar donde la hayas reutilizado. 2) Activa la verificación en dos pasos. 3) Si compartiste datos de tarjeta, llama a tu banco al número de tu tarjeta. 4) Repórtalo en Comunidad > Reportar phishing y en reportfraud.ftc.gov.",
  "Completa los 8 módulos de capacitación y obtén al menos 70% en el cuestionario. Luego abre tu panel y elige Obtener certificado. Puedes descargarlo y agregarlo a LinkedIn con los datos ya completados.",
  "El smishing es phishing por SMS. Desconfía de problemas de entrega, peajes impagos, premios y solicitudes de códigos. No toques enlaces; abre la app oficial. Puedes pegar un SMS sospechoso en el verificador de mensajes de texto del Laboratorio.",
  "Un código QR es solo un enlace oculto. La cámara suele mostrar la dirección antes de abrirla, así que léela. Para estacionamiento o pagos, usa la app oficial o escribe la dirección del letrero.",
  "El simulador de phishing te da una bandeja de práctica con 10 mensajes. Marca cada uno como Seguro o Phishing y luego pulsa Terminar para ver tu puntaje y todas las señales de alerta. Con 80% apruebas. Necesitas al menos un módulo completado para desbloquearlo.",
  "El cuestionario tiene 10 preguntas y se aprueba con 70%. Si sacas menos, puedes repetirlo con un panel de notas abiertas que muestra las lecciones de los temas que fallaste, hasta 3 veces al día.",
  "Ve a Comunidad > Reportar phishing. Elige qué recibiste, completa los detalles y responde tres preguntas rápidas. Recibirás un número de referencia como PN-2026-123456 y un administrador lo revisará.",
  "Usa una frase de contraseña larga de 4 a 6 palabras al azar, distinta para cada cuenta, guardada en un gestor de contraseñas. Prueba el generador y el medidor de seguridad en Herramientas de seguridad.",
  "Los mensajes que piden tarjetas de regalo, transferencias o discreción, sobre todo de un \"jefe\" desde un correo personal, son compromiso del correo empresarial. Verifica siempre con una llamada a un número que ya tengas."
 ],
 sugg: ["¿Qué son SPF y DKIM?","Hice clic en un enlace malicioso. ¿Qué hago?","¿Cómo obtengo mi certificado?","¿Es seguro escanear códigos QR?"]
},

vi: {
 modules: {
  m1: { t:"Lừa đảo qua email", s:"Email hàng loạt giả danh một công ty bạn tin tưởng.",
   how:"Kẻ tấn công sao chép logo và giọng văn của một thương hiệu thật rồi gửi cùng một thông điệp đến hàng nghìn hộp thư, mong vài người bấm vào trước khi kịp suy nghĩ.",
   signs:["Tên miền người gửi không khớp với công ty","Hạn chót gấp hoặc lời đe dọa","Lời chào chung chung như \"Kính gửi Quý khách\"","Nút hoặc liên kết dẫn đến địa chỉ khác","Tệp đính kèm bất ngờ"],
   ex:{ subj:"Tài khoản của bạn đã bị giới hạn", body:"[[Kính gửi Quý khách|Lời chào chung chung]], chúng tôi phát hiện hoạt động bất thường. [[Hãy khôi phục quyền truy cập trong 24 giờ|Áp lực về thời hạn]] nếu không tài khoản sẽ bị đóng. [[Giải quyết ngay|Liên kết dẫn đến paypa1-billing.com, không phải paypal.com]]" },
   lessons:[["Lừa đảo qua email là gì","Email lừa đảo bắt chước một công ty bạn đang dùng: ngân hàng, dịch vụ giao hàng, trường học. Mục tiêu là khiến bạn đăng nhập vào trang giả, trả tiền hoặc mở một tệp.","Phần lớn lừa đảo là trò chơi xác suất. Nó không cần lừa được tất cả, chỉ cần vài người đang bận hoặc lo lắng."],
    ["Đọc đúng người gửi","Tên hiển thị (\"PayPal Service\") là chữ tự do mà ai cũng gõ được. Điều quan trọng là địa chỉ phía sau, đặc biệt là tên miền: phần ngay trước .com hoặc .org.","Trên điện thoại, chạm vào tên người gửi để xem địa chỉ đầy đủ."],
    ["Liên kết và tệp đính kèm","Di chuột lên liên kết (hoặc nhấn giữ trên điện thoại) để xem nó thật sự dẫn đến đâu. Tệp đính kèm có đuôi .exe, .js, .html hoặc đuôi kép như .pdf.exe là chương trình, không phải tài liệu.","Khi nghi ngờ, đừng bấm. Hãy tự mở trang web hoặc ứng dụng của công ty."]] },
  m2: { t:"Lừa đảo có chủ đích (spear phishing)", s:"Tin nhắn viết riêng cho bạn, dùng thông tin thật về bạn.",
   how:"Kẻ tấn công tìm hiểu bạn trước: trường bạn học, tên quản lý của bạn, một lần mua hàng gần đây. Vì cảm giác rất cá nhân, nó lọt qua những hồi chuông cảnh báo thông thường.",
   signs:["Dùng tên, vai trò hoặc hoạt động gần đây của bạn","Yêu cầu bất thường với người đó","Bảo bạn bỏ qua quy trình bình thường","Đến từ địa chỉ giả mạo của một đồng nghiệp thật"],
   ex:{ subj:"Re: Tài liệu dự án CSIT 416", body:"Chào Alex, như đã trao đổi trên lớp, em vui lòng [[xem bản tiêu chí chấm điểm mới|Giảng viên sẽ dùng email trường, không phải Gmail]] trước thứ Sáu: [[rubric-416.html|Tệp đính kèm .html có thể mở trang đăng nhập giả]]" },
   lessons:[["Vì sao thông tin cá nhân khiến ta mất cảnh giác","Lừa đảo có chủ đích lấy bối cảnh thật từ mạng xã hội, danh bạ trường học hoặc các vụ rò rỉ dữ liệu. Tin nhắn càng biết nhiều về bạn thì càng có vẻ đáng tin, và đó chính là mánh khóe.","Thông tin công khai không chứng minh được danh tính."],
    ["Xác minh qua kênh thứ hai","Nếu tin nhắn yêu cầu điều gì bất thường, hãy xác nhận bằng thông tin liên lạc bạn đã có: số điện thoại, cổng thông tin chính thức, hoặc gặp trực tiếp.","Đừng bao giờ xác minh bằng cách trả lời chính tin nhắn đó."],
    ["Thu nhỏ dấu vết của bạn","Hạn chế những gì công khai trên hồ sơ mạng xã hội: lịch trình, thông tin nơi làm việc và người bạn báo cáo. Kẻ tấn công dùng chúng để dựng chuyện thuyết phục.","Kiểm tra cài đặt quyền riêng tư mỗi học kỳ một lần."]] },
  m3: { t:"Lừa đảo qua tin nhắn (smishing)", s:"Lừa đảo bằng tin nhắn văn bản.",
   how:"Tin nhắn hiển thị ít chi tiết hơn email nên liên kết giả khó kiểm tra hơn. Sự cố giao hàng, phí cầu đường chưa trả và cảnh báo ngân hàng là những câu chuyện phổ biến nhất.",
   signs:["Sự cố bất ngờ về giao hàng, phí cầu đường hoặc ngân hàng","Liên kết rút gọn hoặc lạ","Yêu cầu bạn trả lời bằng một mã","Đến từ số điện thoại hoặc email lạ"],
   ex:{ subj:"Tin nhắn văn bản", body:"USPS: [[Bưu kiện của bạn đang bị giữ|Mồi nhử giao hàng]] do địa chỉ chưa đầy đủ. Hãy cập nhật [[trong vòng 12 giờ|Áp lực về thời hạn]]: [[usps-redelivery.top/track|Không phải usps.com, và đuôi .top thường được dùng để lừa đảo]]" },
   lessons:[["Những câu chuyện quen thuộc","Bưu kiện bị giữ, phí cầu đường chưa trả, giao dịch ngân hàng đáng ngờ, giải thưởng bạn chưa từng tham gia. Tất cả đều thúc bạn bấm vào liên kết ngay lập tức.","Đơn vị vận chuyển thật hiếm khi nhắn kèm liên kết nếu bạn không đăng ký nhận thông báo."],
    ["Không bao giờ chia sẻ mã","Mã dùng một lần gửi qua tin nhắn là chìa khóa tài khoản của bạn. Không công ty thật nào yêu cầu bạn đọc lại mã cho họ.","Nếu ai đó hỏi mã, đó là lừa đảo, lần nào cũng vậy."],
    ["Nên làm gì thay vào đó","Đừng bấm vào liên kết. Hãy mở ứng dụng chính thức hoặc tự gõ địa chỉ trang web. Chuyển tiếp tin nhắn lừa đảo đến 7726 (SPAM) để báo cho nhà mạng.","Sau đó xóa tin nhắn."]] },
  m4: { t:"Lừa đảo qua điện thoại (vishing)", s:"Lừa đảo bằng cuộc gọi hoặc thư thoại.",
   how:"Kẻ gọi giả danh ngân hàng, bộ phận hỗ trợ kỹ thuật hoặc cơ quan nhà nước, thường kèm số hiển thị giả mạo. Công nghệ nhân bản giọng nói bằng AI giờ đây có thể bắt chước người bạn quen.",
   signs:["Màn hình hiển thị một cái tên đáng tin","Bị ép phải hành động ngay trong cuộc gọi","Đòi mã, mật khẩu hoặc quyền truy cập từ xa","Đe dọa bắt giữ, phạt tiền hoặc khóa tài khoản"],
   ex:{ subj:"Cuộc gọi nhỡ: \"Chase Fraud Dept\"", body:"Đây là bộ phận chống gian lận của Chase. [[Chúng tôi đã khóa thẻ của quý khách|Gây sợ hãi]]. [[Hãy gọi lại cho chúng tôi ngay|Tạo cấp bách]] theo số 1-888-555-0110 và chuẩn bị sẵn [[mật khẩu ngân hàng trực tuyến|Ngân hàng không bao giờ hỏi mật khẩu của bạn]]." },
   lessons:[["Số hiển thị có thể nói dối","Kẻ lừa đảo có thể làm bất kỳ tên hay số nào hiện lên màn hình của bạn. Số hiển thị quen thuộc không phải là bằng chứng.","Hãy coi mọi cuộc gọi bất ngờ về tiền bạc hay tài khoản là chưa được xác minh."],
    ["Cúp máy và gọi lại","Kết thúc cuộc gọi và bấm số in trên thẻ của bạn hoặc trên trang web chính thức. Ngân hàng thật sẽ hiểu.","Đừng bao giờ dùng số mà người gọi đưa cho bạn."],
    ["Nhân bản giọng nói","Chỉ vài giây âm thanh có thể đủ để nhân bản một giọng nói. Hãy thống nhất một từ khóa gia đình cho trường hợp khẩn cấp.","Nếu người thân gọi xin tiền, hãy cúp máy và tự gọi lại cho họ."]] },
  m5: { t:"Xâm phạm email doanh nghiệp (BEC)", s:"Giả danh sếp hoặc nhà cung cấp để chuyển tiền.",
   how:"Một \"giám đốc\" đòi mua thẻ quà tặng, hoặc một \"nhà cung cấp\" gửi thông tin ngân hàng mới cho hóa đơn. Những tin nhắn này thường không có liên kết nào nên bộ lọc bỏ sót.",
   signs:["Yêu cầu mua thẻ quà tặng hoặc chuyển khoản","Thông tin thanh toán mới hoặc bị thay đổi","Yêu cầu giữ bí mật","Gửi từ địa chỉ cá nhân hoặc địa chỉ giả mạo"],
   ex:{ subj:"Nhờ một việc nhanh", body:"Em có đang ở bàn làm việc không? Chị cần em [[mua 5 thẻ quà tặng Apple|Thẻ quà tặng là hình thức thanh toán không thể truy vết]] cho một khách hàng. [[Tạm thời giữ kín chuyện này nhé|Yêu cầu giữ bí mật]], chị họp cả ngày." },
   lessons:[["Lấy tiền mà không cần mã độc","BEC dựa vào quyền uy và thói quen, không dựa vào liên kết độc hại. Đó là lý do nó gây ra một số thiệt hại lớn nhất trong mọi loại lừa đảo.","Bộ lọc không thể bắt được thứ trông như một tin nhắn bình thường."],
    ["Thay đổi thanh toán phải gọi điện xác nhận","Mọi thay đổi thông tin ngân hàng hoặc khoản thanh toán bất thường cần được xác nhận qua điện thoại bằng số bạn đã lưu từ trước.","Đưa điều này vào quy trình của nhóm để không ai thấy ngại."],
    ["Thẻ quà tặng là dấu hiệu lộ tẩy","Không quản lý hợp pháp nào trả tiền cho khách hàng bằng thẻ quà tặng. Yêu cầu mua thẻ, nhất là kèm đòi giữ bí mật, là dấu hiệu lừa đảo rõ ràng.","Báo ngay cho bộ phận IT hoặc an ninh."]] },
  m6: { t:"Lừa đảo nhân bản (clone phishing)", s:"Bản sao của một email thật bạn từng nhận, nhưng liên kết đã bị tráo.",
   how:"Kẻ tấn công lấy một tin nhắn hợp lệ, như tài liệu được chia sẻ hay biên lai, rồi gửi lại dưới dạng \"phiên bản cập nhật\" kèm liên kết hoặc tệp đính kèm độc hại.",
   signs:["Bản trùng của một email bạn đã nhận","Ghi \"gửi lại\" hoặc \"phiên bản cập nhật\"","Liên kết trỏ đến tên miền khác với bản gốc"],
   ex:{ subj:"GỬI LẠI: Hợp đồng thuê nhà đã sẵn sàng để ký", body:"[[Chúng tôi gửi lại tài liệu này|Bản sao của một tin nhắn thật trước đó]] vì liên kết trước đã hết hạn. [[Xem tài liệu|docusign-mail.review không phải docusign.net]]" },
   lessons:[["Vì sao bản nhân bản hiệu quả","Bạn nhận ra tin nhắn nên thả lỏng. Kẻ tấn công trông chờ vào sự quen thuộc đó.","Một bản sao thứ hai bạn không chờ đợi là lý do để nhìn kỹ hơn, chứ không phải lơ là."],
    ["So sánh với bản gốc","Mở email đầu tiên và so sánh địa chỉ người gửi cũng như đích đến của liên kết. Bất kỳ khác biệt nào cũng là dấu hiệu cảnh báo.","Tìm bản gốc trong hộp thư trước khi bấm."],
    ["Đi thẳng đến nguồn","Với chữ ký và tệp được chia sẻ, hãy mở dịch vụ trực tiếp và kiểm tra các mục đang chờ ở đó.","Yêu cầu thật sẽ chờ sẵn trong tài khoản của bạn."]] },
  m7: { t:"Lừa đảo qua mã QR (quishing)", s:"Mã QR độc hại.",
   how:"Mã QR trên đồng hồ đỗ xe, tờ rơi hoặc trong email có thể dẫn đến trang thanh toán hay đăng nhập giả. Vì không thể đọc mã QR bằng mắt, nó che giấu đích đến.",
   signs:["Nhãn dán đè lên mã gốc","Mã QR trong email yêu cầu bạn đăng nhập","Trang thanh toán không khớp với đơn vị vận hành"],
   ex:{ subj:"Quét mã để duy trì MFA", body:"Thiết lập xác thực đa yếu tố của bạn hết hạn hôm nay. [[Quét mã QR này bằng điện thoại|Chuyển bạn sang thiết bị ít được bảo vệ hơn]] để đăng ký lại. [[Không thực hiện sẽ bị khóa tài khoản|Đe dọa]]." },
   lessons:[["Một liên kết bạn không nhìn thấy","Mã QR chỉ là một liên kết. Quét nó bằng điện thoại khiến bạn rời xa các bộ lọc email trên máy tính.","Ứng dụng camera thường hiển thị địa chỉ trước khi mở. Hãy đọc nó."],
    ["Nhãn dán trên đồng hồ đỗ xe","Kẻ lừa đảo dán mã của chúng đè lên mã thật ở đồng hồ đỗ xe và bàn nhà hàng.","Dùng ứng dụng chính thức của đơn vị vận hành hoặc gõ địa chỉ in trên biển."],
    ["Mã QR trong email","Bộ phận IT thật hiếm khi yêu cầu bạn quét mã để đăng nhập. Hãy coi nó như mọi liên kết bất ngờ khác.","Báo cáo thay vì quét."]] },
  m8: { t:"Lừa đảo trên mạng xã hội", s:"Tài khoản hỗ trợ giả và tin nhắn riêng.",
   how:"Khi bạn phàn nàn công khai với một công ty, các tài khoản \"hỗ trợ\" giả sẽ trả lời và yêu cầu bạn nhắn riêng thông tin đăng nhập hoặc bấm vào liên kết trợ giúp.",
   signs:["Tài khoản hỗ trợ chưa được xác minh","Đòi mật khẩu hoặc mã qua tin nhắn riêng","Giải thưởng hoặc quà tặng bạn chưa từng tham gia","Tài khoản mới, ít người theo dõi"],
   ex:{ subj:"Tin nhắn riêng", body:"Rất tiếc về sự cố thanh toán của bạn! [[Vui lòng xác minh tài khoản tại đây|Bộ phận hỗ trợ thật không bao giờ bảo bạn đăng nhập qua tin nhắn riêng]]: [[netflix-help-desk.co/verify|Không phải netflix.com]]. [[Hãy để ý chữ I hoa trong tên tài khoản|NetfIix dùng chữ I hoa thay cho chữ l]]." },
   lessons:[["Tài khoản hỗ trợ giả","Kẻ tấn công theo dõi các lời phàn nàn công khai và trả lời nhanh bằng tên tài khoản na ná.","Kiểm tra dấu xác minh và tuổi của tài khoản."],
    ["Không bao giờ đăng nhập qua tin nhắn riêng","Bộ phận hỗ trợ thật sẽ không bao giờ hỏi mật khẩu hay mã của bạn trong tin nhắn.","Liên hệ hỗ trợ qua trang web hoặc ứng dụng chính thức của công ty."],
    ["Quà tặng và giải thưởng","Tin nhắn \"Bạn đã trúng thưởng!\" từ tài khoản bạn không theo dõi là cách phổ biến để thu thập dữ liệu cá nhân.","Bạn không tham gia thì bạn không trúng."]] }
 },
 questions: [
  { q:"Phần nào của địa chỉ này cho biết ai thật sự sở hữu trang web? https://login.paypal.com.secure-check.net/account", o:["login","paypal.com","secure-check.net","account"], e:"Tên miền đăng ký là phần ngay trước đuôi, ở đây là secure-check.net. Mọi thứ bên trái nó là tên miền phụ mà chủ sở hữu có thể đặt tùy ý." },
  { q:"Một tin nhắn báo bưu kiện của bạn đang bị giữ và yêu cầu cập nhật địa chỉ qua liên kết. Cách tốt nhất là gì?", o:["Bấm vào liên kết để kiểm tra","Trả lời STOP","Tự mở ứng dụng hoặc trang web của đơn vị vận chuyển bằng mã vận đơn","Chuyển cho bạn bè để hỏi"], e:"Tự vào trang chính thức giúp bạn tránh hoàn toàn liên kết của kẻ tấn công." },
  { q:"\"Giám đốc\" của bạn gửi email từ địa chỉ Gmail, yêu cầu mua thẻ quà tặng gấp và giữ kín. Đây là:", o:["Bình thường với lãnh đạo bận rộn","Xâm phạm email doanh nghiệp","Thư rác vô hại","Lừa đảo nhân bản"], e:"Giả danh lãnh đạo để chuyển tiền, kèm yêu cầu giữ bí mật và gấp gáp, là xâm phạm email doanh nghiệp." },
  { q:"Biểu tượng ổ khóa (https) trên trình duyệt đảm bảo điều gì?", o:["Trang web an toàn","Trang web thuộc về thương hiệu hiển thị","Kết nối được mã hóa","Google đã kiểm tra trang web"], e:"https chỉ mã hóa kết nối. Trang lừa đảo cũng được cấp chứng chỉ miễn phí." },
  { q:"Có người gọi tự xưng từ ngân hàng và hỏi mã vừa được nhắn cho bạn. Bạn nên:", o:["Đọc mã cho họ","Cúp máy và gọi số trên thẻ của bạn","Chỉ đưa một nửa mã","Bảo họ xác nhận địa chỉ của bạn trước"], e:"Mã là chìa khóa. Hãy cúp máy và liên hệ ngân hàng qua số bạn đã tin cậy." },
  { q:"Tên tệp đính kèm nào nguy hiểm nhất?", o:["Invoice_Oct.pdf","Notes.docx","Report.pdf.exe","Photo.jpg"], e:"Đuôi kép kết thúc bằng .exe là chương trình đội lốt tài liệu." },
  { q:"Điều gì khiến lừa đảo có chủ đích khác với lừa đảo thông thường?", o:["Nó được gửi qua điện thoại","Nó được thiết kế riêng cho bạn bằng thông tin cá nhân","Nó luôn dùng mã QR","Nó chỉ nhắm vào doanh nghiệp"], e:"Lừa đảo có chủ đích được nghiên cứu và cá nhân hóa, nên thuyết phục hơn." },
  { q:"Bạn nhận bản sao thứ hai của một email DocuSign ghi \"gửi lại, liên kết trước đã hết hạn\". Bạn nên kiểm tra gì trước tiên?", o:["Logo","Tên miền của liên kết có khớp với bản gốc không","Thời gian nhận","Phông chữ"], e:"Lừa đảo nhân bản tráo liên kết. Hãy so sánh đích đến với tin nhắn gốc." },
  { q:"Một đồng hồ đỗ xe có nhãn dán mã QR đè lên mã in sẵn. Cách nào an toàn nhất?", o:["Quét nhãn dán","Quét mã in bên dưới","Dùng ứng dụng chính thức của đơn vị vận hành hoặc địa chỉ trên biển","Trả tiền cho người qua đường"], e:"Nhãn dán có thể che mã thật. Ứng dụng chính thức hoặc tự gõ địa chỉ giúp tránh cả hai rủi ro." },
  { q:"Một tài khoản hỗ trợ trả lời lời phàn nàn công khai của bạn và đòi bạn nhắn riêng mật khẩu. Đây là:", o:["Hỗ trợ bình thường","Lừa đảo trên mạng xã hội","Một vụ rò rỉ dữ liệu","Lừa đảo qua điện thoại"], e:"Tài khoản hỗ trợ giả đòi thông tin đăng nhập là lừa đảo trên mạng xã hội. Hỗ trợ thật không bao giờ hỏi mật khẩu." }
 ],
 sim: {
  s1:{ from:"Bộ phận hỗ trợ IT", subj:"Mật khẩu hết hạn hôm nay", time:"8:02 SA", body:"Mật khẩu trường của bạn [[sẽ hết hạn sau 2 giờ|Thời hạn hai giờ]]. Hãy giữ quyền truy cập bằng cách xác nhận [[mật khẩu hiện tại|IT thật không bao giờ hỏi mật khẩu của bạn]] bên dưới.\n\n{{Giữ mật khẩu của tôi|https://campus-it-support.net/portal/confirm}}\n\nPhòng Dịch vụ IT", flags:["Tên miền người gửi campus-it-support.net không phải của trường"] },
  s2:{ subj:"Biên lai của bạn từ Spotify", time:"7:41 SA", body:"Cảm ơn bạn đã thanh toán.\n\nSpotify Premium Individual: $11.99\nThanh toán bằng thẻ Visa đuôi 4417 ngày 1 thg 11, 2026.\n\nCó thắc mắc? Truy cập spotify.com/account trên trình duyệt.", why:"Gửi từ spotify.com, không có gì để bấm, và bảo bạn tự vào trang web." },
  s3:{ subj:"Jennifer đã chia sẻ \"Q4 Bonus Schedule.pdf\"", time:"Hôm qua", body:"Jennifer Walsh đã gửi bạn một tài liệu để xem và ký: [[Bảng thưởng quý 4|Tên tệp hấp dẫn]].\n\n{{Xem tài liệu|https://docusign-mail.review/sign?id=88412}}\n\n[[Liên kết này hết hạn sau 24 giờ.|Thời hạn ngắn]]", flags:["docusign-mail.review không phải docusign.net"] },
  s4:{ from:"Maria Chen (Giám đốc)", subj:"Nhờ một việc nhanh", time:"Hôm qua", body:"Em có đang ở bàn không? Chị đang họp và cần em [[mua 5 thẻ quà tặng Apple (mỗi thẻ $200)|Thanh toán bằng thẻ quà tặng]] cho một khách hàng. Cào mặt sau rồi chụp ảnh gửi chị. [[Tạm thời giữ kín chuyện này nhé.|Giữ bí mật]]", flags:["Lãnh đạo dùng địa chỉ Gmail cá nhân"] },
  s5:{ subj:"[GitHub] Một khóa SSH mới đã được thêm", time:"T2", body:"Xin chào,\n\nMột khóa công khai mới đã được thêm vào tài khoản của bạn. Nếu chính bạn thêm, có thể bỏ qua email này.\n\nNếu không, hãy tự mở GitHub và kiểm tra Settings > SSH keys.", why:"Gửi từ github.com, không có liên kết đăng nhập, và bảo bạn tự vào trang web. Đây là thông báo bảo mật thật." },
  s6:{ subj:"Đơn hàng #112-4471 không thể giao", time:"T2", body:"[[Chào Quý khách,|Lời chào chung chung]]\n\nPhương thức thanh toán của bạn bị từ chối. [[Hãy cập nhật thông tin thanh toán|Đòi thông tin thẻ]] để tránh bị hủy đơn.\n\n{{Cập nhật thanh toán|http://amaz0n-orders.com/billing}}", flags:["\"amaz0n\" dùng số 0","http thay vì https"] },
  s7:{ subj:"E-ZPass: phí cầu đường chưa thanh toán", time:"CN", body:"E-ZPass: Bạn có [[khoản phí cầu đường $4.15 chưa thanh toán|Số tiền nhỏ để bạn không nghĩ ngợi]]. Hãy thanh toán [[hôm nay để tránh phí trễ hạn $50|Đe dọa phạt phí]]: {{ezpass-tollpay.top|https://ezpass-tollpay.top/pay}}", flags:["Cơ quan thu phí không nhắn liên kết từ số ngẫu nhiên"] },
  s8:{ subj:"Cảnh báo Chase", time:"CN", body:"Chase: Thẻ đuôi 9921 của bạn vừa thanh toán $42.18 tại TRADER JOE'S. Nếu không nhận ra giao dịch này, hãy gọi số ở mặt sau thẻ. Chúng tôi sẽ không bao giờ hỏi mật khẩu hay mã của bạn.", why:"Không có liên kết, đầu số ngắn bạn từng thấy, và hướng bạn đến số trên thẻ." },
  s9:{ subj:"Chào, Emily phải không?", time:"T7", body:"[[Chào, Emily phải không? Tuần trước mình gặp nhau ở hội thảo đó|Mở đầu kiểu \"nhầm số\"]]. Chú mình đang chỉ mình một [[ứng dụng giao dịch tiền mã hóa lãi đảm bảo 30%|Lãi đảm bảo là dấu hiệu lừa đảo]], bạn có muốn link không?", flags:["Các cuộc trò chuyện \"nhầm số\" thường dẫn đến lừa đảo đầu tư"] },
  s10:{ from:"Phòng Hỗ trợ Tài chính Montclair", subj:"Khoản giải ngân học kỳ xuân đang bị giữ", time:"T6", body:"Bạn sinh viên thân mến,\n\nKhoản hỗ trợ tài chính học kỳ xuân của bạn đang bị giữ chờ [[xác minh danh tính|Yêu cầu hợp lý nhưng bất ngờ]]. Vui lòng tải lên ảnh [[bằng lái xe và thẻ an sinh xã hội|Không bao giờ gửi giấy tờ tùy thân qua liên kết email]].\n\n{{Xác minh danh tính|https://montclair-edu.org/aid/verify}}", flags:["montclair-edu.org không phải montclair.edu"] },
  s11:{ from:"Thông báo Canvas", subj:"CSIT 416: Bài tập đã được chấm", time:"T6", body:"Bài nộp \"Đặc tả ca sử dụng\" của bạn đã được chấm điểm.\n\nHãy mở Canvas từ cổng thông tin của trường để xem nhận xét.", why:"Gửi từ instructure.com (tên miền thật của Canvas), và bảo bạn tự mở Canvas." },
  s12:{ time:"T5", body:"Verizon: Hóa đơn $65.00 của bạn đã sẵn sàng. Xem trong ứng dụng My Verizon. Trả lời HELP để được trợ giúp, STOP để hủy nhận tin.", why:"Đầu số ngắn quen thuộc, không có liên kết, và hướng bạn đến ứng dụng chính thức." }
 },
 videos: {
  v1:{ t:"Nhận ra người gửi giả trong 3 phút", topic:"Lừa đảo qua email", caps:["Bắt đầu từ địa chỉ, không phải tên.","Tên miền là phần ngay trước .com.","micros0ft không phải microsoft."] },
  v2:{ t:"Năm loại tin nhắn không bao giờ được tin", topic:"Lừa đảo qua tin nhắn (smishing)", caps:["Bưu kiện bị giữ? Mở ứng dụng của đơn vị vận chuyển.","Không bao giờ chia sẻ mã dùng một lần.","Chuyển tiếp tin nhắn lừa đảo đến 7726."] },
  v3:{ t:"Làm gì trong giờ đầu tiên sau khi lỡ bấm", topic:"Ứng phó", guide:["Ngắt kết nối nếu bạn đã tải gì đó xuống. Tắt Wi-Fi để chặn mọi chương trình liên lạc với kẻ tấn công.","Đổi mật khẩu tài khoản bị ảnh hưởng từ một thiết bị khác đáng tin cậy. Nếu bạn dùng lại mật khẩu đó ở đâu, hãy đổi luôn ở đó.","Bật xác minh hai bước, tốt nhất bằng ứng dụng xác thực hoặc khóa truy cập (passkey) thay vì SMS.","Gọi ngân hàng theo số trên thẻ nếu bạn đã nhập thông tin thanh toán.","Báo cáo: cho bộ phận IT của trường hoặc nơi làm việc, tại reportfraud.ftc.gov, và tại Phish Net để cảnh báo người khác.","Theo dõi tài khoản trong vài tuần. Email đặt lại mật khẩu bất ngờ nghĩa là có người đang thử."] },
  v4:{ t:"Giải thích về xâm phạm email doanh nghiệp", topic:"Xâm phạm email doanh nghiệp (BEC)", caps:["BEC hiếm khi có liên kết.","Thẻ quà tặng là dấu hiệu lộ tẩy.","Xác nhận thay đổi thanh toán qua điện thoại."] },
  v5:{ t:"Đọc tiêu đề email không còn đáng sợ", topic:"Lừa đảo qua email", guide:["Mở tiêu đề đầy đủ: trong Gmail dùng menu ba chấm rồi chọn \"Hiển thị bản gốc\"; trong Outlook chọn \"Xem nguồn thư\".","Tìm Authentication-Results. SPF, DKIM và DMARC phải ghi pass với người gửi thật.","So sánh tên miền From với Return-Path và Reply-To. Sự không khớp đáng để nghi ngờ.","DMARC thất bại với một thương hiệu nổi tiếng là dấu hiệu giả mạo rõ ràng.","Dán tiêu đề vào công cụ kiểm tra tiêu đề email trong Phòng thử nghiệm để xem giải thích từng tín hiệu."] }
 },
 badges: { hero:["Mắt tinh","Tìm đủ 5 dấu hiệu trên trang chủ"], first:["Bài học đầu tiên","Hoàn thành một bài học"], half:["Đã đi nửa đường","Hoàn thành 4 bài học"], all:["Hoàn thành khóa học","Hoàn thành cả 8 bài học"], quiz:["Đạt câu đố","Đạt 70% trở lên trong câu đố"], ace:["Bậc thầy câu đố","Đạt 100% trong câu đố"], sim:["Người bảo vệ hộp thư","Vượt qua một bài mô phỏng"], report:["Người báo cáo","Gửi báo cáo lừa đảo đầu tiên"], notes:["Người ghi chép","Lưu ghi chú cho video hoặc hướng dẫn"], cert:["Đã có chứng chỉ","Nhận chứng chỉ của bạn"] },
 faq: [
  "SPF kiểm tra xem máy chủ gửi có được phép gửi thay cho tên miền đó không. DKIM là chữ ký số chứng minh thư không bị sửa đổi và đến từ tên miền đó. DMARC cho bên nhận biết phải làm gì khi các kiểm tra kia thất bại. Trong Phòng thử nghiệm, công cụ kiểm tra giả mạo email giải thích từng kết quả.",

re request": "Lừa đảo nhân bản, yêu cầu ký giả", "Lookalike domain, account limitation lure": "Tên miền giả, mồi nhử tài khoản bị giới hạn", "Shortener link disabled by provider": "Liên kết rút gọn đã bị nhà cung cấp vô hiệu hóa", "Email said my spring aid was on hold and asked me to upload my license and SSN card through a link.": "Email báo khoản hỗ trợ học kỳ xuân của tôi đang bị giữ và yêu cầu tải lên bằng lái và thẻ an sinh xã hội qua một liên kết.", "Text about an unpaid E-ZPass toll of $4.15 with a link.": "Tin nhắn về khoản phí cầu đường E-ZPass $4.15 chưa trả, kèm liên kết.", "A 'Netflix support' account on X replied to my complaint and sent this link.": "Một tài khoản \"hỗ trợ Netflix\" trên X trả lời lời phàn nàn của tôi và gửi liên kết này.", "Got a Spotify receipt but I don't remember paying. Is this phishing?": "Tôi nhận biên lai Spotify nhưng không nhớ đã thanh toán. Đây có phải lừa đảo không?", "Caller said he was from Chase fraud and asked for the code they just texted me.": "Người gọi nói là từ bộ phận chống gian lận Chase và hỏi mã vừa được nhắn cho tôi.", "Got the same one this morning. Reported to IT too.": "Sáng nay tôi cũng nhận được y hệt. Đã báo cho IT luôn.", "Confirmed and added to the blacklist. Thanks Alex.": "Đã xác nhận và thêm vào danh sách đen. Cảm ơn Alex.", "E-ZPass doesn't text like this. Definitely fake.": "E-ZPass không nhắn tin kiểu này. Chắc chắn là giả.", "Check your Spotify account directly. Might be a family plan charge.": "Kiểm tra trực tiếp tài khoản Spotify nhé. Có thể là phí gói gia đình.", "Legitimate Spotify receipt sent from spotify.com. No phishing indicators.": "Biên lai Spotify hợp lệ gửi từ spotify.com. Không có dấu hiệu lừa đảo.", "Is a QR code on a campus flyer safe to scan?": "Quét mã QR trên tờ rơi trong trường có an toàn không?", "There's a flyer for free concert tickets with a QR code. How can I check it first?": "Có tờ rơi tặng vé hòa nhạc miễn phí kèm mã QR. Làm sao để kiểm tra trước?", "Your camera shows the address before opening. If it's not a montclair.edu link, skip it.": "Camera sẽ hiện địa chỉ trước khi mở. Nếu không phải liên kết montclair.edu thì bỏ qua.", "What's the difference between SPF and DKIM?": "SPF và DKIM khác nhau thế nào?", "The header checker mentions both.": "Công cụ kiểm tra tiêu đề có nhắc đến cả hai.", "Finished all 8 modules before finals week!": "Đã xong cả 8 bài học trước tuần thi cuối kỳ!", "Caught every phish on Advanced. The CEO gift card one is sneaky.": "Bắt được hết tin lừa đảo ở mức Nâng cao. Vụ giám đốc đòi thẻ quà tặng khá tinh vi.", "The simulator is the best part. Felt like a real inbox.": "Trình mô phỏng là phần hay nhất. Cảm giác như hộp thư thật.", "Would love more advanced simulations.": "Mong có thêm bài mô phỏng nâng cao.", "The header checker was confusing at first. A video would help.": "Lúc đầu công cụ kiểm tra tiêu đề hơi khó hiểu. Có video sẽ dễ hơn."};
